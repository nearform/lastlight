kind: review
name: pr-review
# PR-scoped (09-state-machine.md §S1/§S4): this workflow runs against a pull
# request, so it crosses the PR-scoped dispatch gate — the run lock shared with
# every other PR-scoped workflow, the per-head-SHA dedup, escalation, and the
# resolved `PrState` snapshot on `context.prState`. A fork of this workflow that
# drops the key silently loses all four; `validateAssets` warns when a
# `routes.github.pr_*` target is missing it.
pr_scoped: true
classification:
  intent: review
  description: |
    REVIEW — The user wants a code review. Either repo-wide ("review cliftonc/repo", "check PRs", "can you review PRs on <repo>?") OR, when the comment is a reply on a PR (ISSUE TITLE present), a request to review THIS PR: "review this", "can you review this?", "please review", "take a look at this PR", "give this a review". The deliverable is a formal PR review (inline comments on the diff). Prefer REVIEW over CHAT whenever there's a clear "review"/"take a look" request on a PR.
  examples:
    - '"please review https://github.com/foo/bar/pull/42" → INTENT: REVIEW, REPO: foo/bar, ISSUE: 42, REASON: NONE'
    - '"can you review this?" with ISSUE TITLE "Add HTML sanitizer for messages" → INTENT: REVIEW, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - '"take a look at this PR when you get a chance" with ISSUE TITLE "Port fastify adapter" → INTENT: REVIEW, REPO: NONE, ISSUE: NONE, REASON: NONE'
chat:
  trigger: review PRs on owner/repo
  summary: Review the open PRs on a repo
  deflect:
    - review PRs on <repo>
    - check open PRs
description: |
  Review a single GitHub pull request: read the diff, check for issues, and
  post structured feedback. Does not run a full build cycle and does not
  modify code.

  Triggered by:
    - pr.opened webhook
    - cron scan over managed repos
    - manual CLI: tsx src/cli.ts review owner/repo#N

phases:
  # ── The evidence pipeline (WP3). INERT unless `review.analysis.enabled`. ────
  #
  # Every phase below carries `skip_if: "analysisEnabled != true"`, and that key
  # reaches the context ONLY from `specContext` in pr-decisions.ts, which returns
  # `{}` when the pipeline is off. `evalSkipIf` coerces an absent variable to
  # false, so `!= true` matches and the phase skips — the failure direction of a
  # typo anywhere in this block is "the analysis does not run", never "an
  # unmeasured pipeline runs on a deployment that did not ask for it".
  #
  # Phases 1–3 spend NO MODEL. They are deterministic bash, and they are first
  # so the six surveys below all read one artifact.
  #
  # `prepare` (WP4) carries its OWN gate — `probesEnabled`, projected only when
  # the operator set `review.analysis.probes` as well as `enabled`. A deployment
  # that turned on the pipeline but not probes runs WP3 exactly as before: this
  # phase skips and `facts` sees the bare pre-clone it has always seen.
  - name: prepare
    label: Prepare · probe environment
    type: bash
    # BOTH gates, and the second is not redundant. `specContext` only projects
    # `probesEnabled` when the pipeline is enabled too, so the pair can never
    # disagree in production — but this phase is the one that installs a pull
    # request author's dependency tree, and "it cannot happen because of how the
    # projection is written" is a weaker guarantee than "the phase refuses". An
    # install with no surveys to feed is pure cost either way.
    skip_if:
      - "analysisEnabled != true"
      - "probesEnabled != true"
    # The PHASE's ceiling, summed across the three steps in `specContext` —
    # NOT the install budget. A phase killed part-way through a coverage run
    # writes no env.json at all, which is the outcome this whole design exists
    # to prevent.
    timeout_seconds: { from: probePhaseTimeoutSeconds, default: 300 }
    # FIRST, and that ordering is measured rather than tidy. On a bare checkout
    # a tsconfig that `extends` a bare package specifier
    # (`@calcom/tsconfig/react-library.json`) does not resolve; tsgo reports a
    # config parsing error and EXCLUDES the project, the case drops to tier 2,
    # and `contracts` emits nothing. Across the 50-PR corpus that is tier-1
    # cases 21 -> 5 and contract deltas 73 -> 19, one cause, all 16 demoted
    # cases. So this phase is not an affordance for probes — it is a
    # precondition for two of the six obligation families, and it has to run
    # before `facts` for either of them to see anything.
    #
    # The same shell-level catch as `facts` below, for the same §D12 reason: a
    # phase that dies without writing its artifact is re-dispatched by
    # cron-review.yaml every thirty minutes, forever.
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      OUT=.lastlight/pr-review/probes/env.json
      mkdir -p .lastlight/pr-review/probes

      # `installed` is read off the FILESYSTEM even in the fallback, because it
      # is the only question a later phase asks and a dead process still leaves
      # whatever it managed to unpack.
      fallback() {
        if [ -d node_modules ]; then INSTALLED=true; else INSTALLED=false; fi
        printf '{"version":1,"generatedAt":"%s","repo":"{{owner}}/{{repo}}","packageManager":null,"install":"failed","installed":%s,"lifecycleScripts":false,"typecheck":"failed","typecheckDiagnostics":[],"coverage":"failed","coverageReport":null,"durationMs":{"install":0,"typecheck":0,"coverage":0,"total":0},"degraded":[{"extractor":"prepare","reason":"%s"}]}\n' \
          "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" "$INSTALLED" "$1" > "$OUT"
      }

      ARGS="--repo . --out $OUT"
      # Each sub-switch is projected as the literal string "true"/"false" and
      # absent means OFF, so the failure direction of every one of them is "do
      # the cheap thing" rather than "install a stranger's postinstall".
      [ "{{probeLifecycleScripts}}" = "true" ] && ARGS="$ARGS --lifecycle-scripts"
      [ "{{probeTypecheck}}" = "true" ] && ARGS="$ARGS --typecheck"
      [ "{{probeCoverage}}" = "true" ] && ARGS="$ARGS --coverage"

      if ! "$FACTS" prepare $ARGS --never-fail; then
        fallback "the prepare process died without writing env.json (OOM, or a CLI that could not be executed) — dependencies may be absent or partial, so NOTHING downstream may read a thin analysis as evidence that there is nothing to find"
      fi
      echo "prepare: $(wc -c < "$OUT" 2>/dev/null || echo 0) bytes"

  - name: facts
    label: Facts · deterministic
    type: bash
    skip_if: "analysisEnabled != true"
    # `all_done`, not the default `all_success`: `prepare` SKIPS on every
    # deployment that has not enabled probes, and a skipped node is not
    # `succeeded`. With `all_success` here the entire pipeline below would
    # vanish the moment WP4 shipped off.
    depends_on: [prepare]
    trigger_rule: all_done
    timeout_seconds: 300
    # §D12, and the reason it is a shell-level `||` rather than trust in
    # `--never-fail`: that flag is an in-process try/catch and cannot cover a
    # process that DIES. An OOM, a segfault in the ast-grep native binary, or a
    # tsgo executable that cannot exec all exit without writing an envelope —
    # and a phase that fails hard is re-dispatched by cron-review.yaml every
    # thirty minutes, forever. So the catch writes a `coverage: "none"` envelope
    # itself and exits 0. The survey phases then say "nothing was analysed"
    # instead of reading silence as "nothing was found".
    #
    # FACTS resolution is §D1's order — LASTLIGHT_FACTS_BIN, then PATH, then the
    # image path. Expressed here in shell rather than reimplemented in core,
    # which has no edge to code-facts and must not grow one for this.
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      OUT=.lastlight/pr-review/facts.json
      mkdir -p .lastlight/pr-review

      # The fallback envelope must VALIDATE, or the loudness is lost twice over:
      # `seed` parses this file against AllDocumentSchema and exits UNAVAILABLE
      # on a malformed one, which would leave no obligations AND no block saying
      # why. A complete `coverage: "none"` document is what makes the survey
      # phases print "nothing was analysed" instead of reading silence as clean.
      fallback() {
        printf '{"version":2,"generatedAt":"%s","extractor":"all","repo":"{{owner}}/{{repo}}","baseSha":"%s","headSha":"%s","tier":3,"engine":"none","languages":[],"coverage":"none","degraded":[{"extractor":"facts","reason":"%s"}],"toolchain":{"manifest":2,"bundled":{},"binaries":{}},"extractors":{}}\n' \
          "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" "${BASE:-unknown}" "$(git rev-parse HEAD 2>/dev/null || echo unknown)" "$1" > "$OUT"
      }

      # Resolve the MERGE BASE, never the base branch tip. Two-dot additionally
      # contains every commit that landed on the base branch since the PR forked,
      # and the author wrote none of it — measured across 50 real PRs, 9 diverge,
      # one of them 6125 files against 3. A base we cannot resolve is a loud
      # failure, NOT a silent fallback to HEAD~1: analysing the wrong range and
      # reporting success is the exact shape this pipeline exists to stop.
      if ! BASE="$(git merge-base origin/{{baseBranch}} HEAD 2>/dev/null)" || [ -z "$BASE" ]; then
        fallback "no merge base between origin/{{baseBranch}} and HEAD (unrelated histories, or a clone too shallow to share one) — the diff range could not be established, so NOTHING here may be read as 'no findings'"
        echo "facts: no merge base — wrote a coverage:none envelope"
        exit 0
      fi

      # §D12, and the reason this is a shell-level catch rather than trust in
      # `--never-fail`: that flag is an in-process try/catch and cannot cover a
      # process that DIES.
      if ! "$FACTS" all --repo . --base "$BASE" --head HEAD --out "$OUT" --never-fail; then
        fallback "the analysis process died without writing an envelope (OOM, a segfault in the native parser, or a compiler binary that cannot exec) — NOTHING here may be read as 'no findings'"
      fi
      echo "facts: $(wc -c < "$OUT" 2>/dev/null || echo 0) bytes, base $BASE"

  - name: seed
    label: Seed · obligations
    type: bash
    skip_if: "analysisEnabled != true"
    depends_on: [facts]
    trigger_rule: all_done
    timeout_seconds: 120
    # One obligations.json plus one rendered BLOCK per family. The blocks carry
    # their own discharge contract — emitted from code, never from a template —
    # for the reason renderSpecObligations does: v3 measured a 17-row ledger
    # honestly discharged into ZERO findings, and obligations without the
    # contract reproduce exactly that.
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      mkdir -p .lastlight/pr-review/hypotheses
      "$FACTS" seed --facts .lastlight/pr-review/facts.json \
        --out .lastlight/pr-review/obligations.json \
        --blocks .lastlight/pr-review/obligations || true
      echo "seed: $(ls .lastlight/pr-review/obligations 2>/dev/null | wc -l) family block(s)"

  # ── The six surveys. One phase per family, chained. ────────────────────────
  #
  # NOT a `generic_loop` over a `families` list, and the reason is measured:
  # `until_bash` rejects template markers and the only env a phase receives is
  # `LL_OUT_<PHASE>`, so `$LL_FAMILY` was never set, the gate tested
  # `hypotheses/.jsonl`, always failed, and the loop ran to `max_iterations`
  # against a gate that meant nothing — the dependency-cruiser failure shape.
  # Worse, `surveyPasses` defaulted to 3 against six families and nothing
  # recorded which three ran.
  #
  # Six phases buy LITERAL gates (no templating, so the gate is real), all six
  # families, per-family timeouts, individual ledger rows and retryability, and
  # a dashboard node each. Separate phases never share a transcript, so the
  # context isolation comes free.
  #
  # PROMPT ORDER IS FIXED HERE AND IS EXPENSIVE TO RETROFIT: the shared prefix
  # (skills, AGENTS.md, diff summary) goes FIRST and the family's obligations
  # LAST, because provider-side prompt caching is keyed on the request prefix.
  # Six passes then share one cached prefix.
  - name: survey_contract
    label: Survey · contract
    skills: [pr-review, code-review]
    prompt: prompts/survey-contract.md
    model: "{{models.review-survey}}"
    skip_if: "analysisEnabled != true"
    depends_on: [seed]
    trigger_rule: all_done
    generic_loop:
      max_iterations: 1
      # INSIDE the loop, which is where the schema puts it. At phase
      # level — where all six of these were until 2026-08-22 — zod
      # strips it, the policy silently reverts to `{retries: 0, then:
      # fail}`, and one degenerate turn HARD-FAILS the whole review.
      # That is the §D12 shape exactly: a failed run records no
      # `assessedHeadShaByWorkflow` and cron-review.yaml re-dispatches
      # it every thirty minutes, forever.
      on_soft_failure: { retries: 1, then: complete }
      until_bash: |
        test -s .lastlight/pr-review/hypotheses/contract.jsonl

  - name: survey_enforcement
    label: Survey · enforcement
    skills: [pr-review, code-review]
    prompt: prompts/survey-enforcement.md
    model: "{{models.review-survey}}"
    skip_if: "analysisEnabled != true"
    depends_on: [survey_contract]
    trigger_rule: all_done
    generic_loop:
      max_iterations: 1
      # INSIDE the loop, which is where the schema puts it. At phase
      # level — where all six of these were until 2026-08-22 — zod
      # strips it, the policy silently reverts to `{retries: 0, then:
      # fail}`, and one degenerate turn HARD-FAILS the whole review.
      # That is the §D12 shape exactly: a failed run records no
      # `assessedHeadShaByWorkflow` and cron-review.yaml re-dispatches
      # it every thirty minutes, forever.
      on_soft_failure: { retries: 1, then: complete }
      until_bash: |
        test -s .lastlight/pr-review/hypotheses/enforcement.jsonl

  - name: survey_security
    label: Survey · security
    skills: [pr-review, code-review, security-review]
    prompt: prompts/survey-security.md
    model: "{{models.review-survey}}"
    skip_if: "analysisEnabled != true"
    depends_on: [survey_enforcement]
    trigger_rule: all_done
    generic_loop:
      max_iterations: 1
      # INSIDE the loop, which is where the schema puts it. At phase
      # level — where all six of these were until 2026-08-22 — zod
      # strips it, the policy silently reverts to `{retries: 0, then:
      # fail}`, and one degenerate turn HARD-FAILS the whole review.
      # That is the §D12 shape exactly: a failed run records no
      # `assessedHeadShaByWorkflow` and cron-review.yaml re-dispatches
      # it every thirty minutes, forever.
      on_soft_failure: { retries: 1, then: complete }
      until_bash: |
        test -s .lastlight/pr-review/hypotheses/security.jsonl

  - name: survey_state
    label: Survey · state
    skills: [pr-review, code-review]
    prompt: prompts/survey-state.md
    model: "{{models.review-survey}}"
    skip_if: "analysisEnabled != true"
    depends_on: [survey_security]
    trigger_rule: all_done
    generic_loop:
      max_iterations: 1
      # INSIDE the loop, which is where the schema puts it. At phase
      # level — where all six of these were until 2026-08-22 — zod
      # strips it, the policy silently reverts to `{retries: 0, then:
      # fail}`, and one degenerate turn HARD-FAILS the whole review.
      # That is the §D12 shape exactly: a failed run records no
      # `assessedHeadShaByWorkflow` and cron-review.yaml re-dispatches
      # it every thirty minutes, forever.
      on_soft_failure: { retries: 1, then: complete }
      until_bash: |
        test -s .lastlight/pr-review/hypotheses/state.jsonl

  # `tests` is seeded from `coverage`, which READS a report nothing in the
  # pipeline produces until WP4's `prepare`. Measured: 0 artifacts across 50
  # corpus cases AND all 8 gate cases. The phase ships so the wiring is exercised
  # and so its funnel row exists; the block it reads says NOT MEASURED in those
  # words, and a `notMeasured` family must never be reported as "did not convert".
  - name: survey_tests
    label: Survey · tests
    skills: [pr-review, code-review]
    prompt: prompts/survey-tests.md
    model: "{{models.review-survey}}"
    skip_if: "analysisEnabled != true"
    depends_on: [survey_state]
    trigger_rule: all_done
    generic_loop:
      max_iterations: 1
      # INSIDE the loop, which is where the schema puts it. At phase
      # level — where all six of these were until 2026-08-22 — zod
      # strips it, the policy silently reverts to `{retries: 0, then:
      # fail}`, and one degenerate turn HARD-FAILS the whole review.
      # That is the §D12 shape exactly: a failed run records no
      # `assessedHeadShaByWorkflow` and cron-review.yaml re-dispatches
      # it every thirty minutes, forever.
      on_soft_failure: { retries: 1, then: complete }
      until_bash: |
        test -s .lastlight/pr-review/hypotheses/tests.jsonl

  # `spec` is WP0's and is built HARNESS-side from the PR body and linked issues
  # (review-spec.ts), so it reads `{{specObligations}}` from the context rather
  # than a block on disk. It is the only untried axis and it is orthogonal to
  # everything the investigation has tried.
  - name: survey_spec
    label: Survey · spec
    skills: [pr-review, code-review]
    prompt: prompts/survey-spec.md
    model: "{{models.review-survey}}"
    skip_if: "analysisEnabled != true"
    depends_on: [survey_tests]
    trigger_rule: all_done
    generic_loop:
      max_iterations: 1
      # INSIDE the loop, which is where the schema puts it. At phase
      # level — where all six of these were until 2026-08-22 — zod
      # strips it, the policy silently reverts to `{retries: 0, then:
      # fail}`, and one degenerate turn HARD-FAILS the whole review.
      # That is the §D12 shape exactly: a failed run records no
      # `assessedHeadShaByWorkflow` and cron-review.yaml re-dispatches
      # it every thirty minutes, forever.
      on_soft_failure: { retries: 1, then: complete }
      until_bash: |
        test -s .lastlight/pr-review/hypotheses/spec.jsonl

  # ── WP4's oracle. The only phase that RUNS anything. ───────────────────────
  #
  # Gated on `probesEnabled` like `prepare`, and for one shared reason: a probe
  # needs a tree it can execute in. With probes off this skips and the run is
  # WP3 exactly — six surveys and the shipped reviewer.
  #
  # It reads the hypothesis RECORDS and the code, never an earlier pass's
  # transcript. That is AnyPoC's checker-with-no-access-to-the-generator's-context,
  # implemented with the mechanism this engine has (a separate phase), and it is
  # why the phase exists rather than a seventh survey: baseline agents fail to
  # reject 96% of false reports when they can see the reasoning that produced
  # them.
  #
  # NOTE what it cannot do yet. Nothing reads `probes/verdicts.jsonl` — WP6's
  # `adjudicate` is its consumer and does not exist, so this phase moves the
  # MECHANISM metrics (probes attempted / succeeded / reproduced / refuted) and
  # cannot move recall. That is a known non-goal, not an oversight.
  - name: falsify
    label: Falsify · run the probe
    skills: [pr-review, code-review]
    prompt: prompts/review-falsify.md
    model: "{{models.review-survey}}"
    skip_if:
      - "analysisEnabled != true"
      - "probesEnabled != true"
    depends_on: [survey_spec]
    trigger_rule: all_done
    generic_loop:
      # `on_soft_failure` lives INSIDE the loop — see the six surveys above for
      # what it costs when it does not.
      on_soft_failure: { retries: 1, then: complete }
      # Two rounds. v3's lesson 3 is the sizing argument and it was measured: a
      # five-line existence gate earned the investigation's only gold match,
      # while v2's full quote validator was overkill and cost 2.4x.
      max_iterations: { from: probeRounds, default: 2 }
      # The gate is an EXISTENCE check and it is deliberately satisfiable in one
      # pass without lying: a hypothesis that genuinely cannot be executed
      # against is recorded `unprobed`, which closes the gate for it and carries
      # the claim forward to adjudication with lowered confidence. An
      # unsatisfiable gate is the shape WP3 already hit once — `$LL_FAMILY` was
      # never set, so the gate tested `hypotheses/.jsonl`, always failed, and the
      # loop ran to `max_iterations` against a condition that meant nothing.
      #
      # Literal shell, no template markers: `validateShellCommand` rejects any
      # command containing `{{` outright.
      until_bash: |
        FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
        "$FACTS" probes --dir .lastlight/pr-review

  - name: review
    label: Review
    # EXPLICIT, and `all_done` rather than the default `all_success`, because
    # declaring `depends_on` anywhere in a workflow disables the synthesized
    # linear chain for ALL of it (`buildDag`'s `anyDeclared`). Without these two
    # lines `review` and `post-review` become root nodes and run in PARALLEL
    # with the surveys — and with `all_success` they would instead be SKIPPED
    # whenever the analysis phases skip, which is every deployment that has not
    # enabled the pipeline. `all_done` is the rule the schema names for exactly
    # this: a skipped node is not `succeeded`.
    depends_on: [falsify]
    trigger_rule: all_done
    # pr-review: the PR procedure (primary). code-review: the finding-tier +
    # what-to-check rubric. No `building` — pr-review is a pure code review; CI
    # validates that the change builds/runs.
    #
    # The agent does NOT submit the review itself — it writes structured
    # findings (content only: skip? / summary / event / findings[]) to
    # .lastlight/pr-review/findings.json. The first-class `post-review` action
    # below reads that file and posts one formal review.
    skills: [pr-review, code-review]
    model: "{{models.review}}"
    variant: "{{variants.review}}"

  # First-class, in-process submission (type: post-review → PhaseExecutor.
  # runPostReview). Reads the agent's findings.json for the review *content*
  # (skip? / summary / event / findings[]) and supplies everything else from
  # the harness itself — PR number (run context), base ref (baseBranch), head
  # SHA + diff (the pre-cloned checkout) — so the AI never hand-copies metadata.
  # It anchors each finding to a changed line, demotes off-diff findings to the
  # body (GitHub 422s on off-diff lines), and posts ONE review via GitHubClient
  # (App auth in prod; token + githubApiBaseUrl against the eval mock). A
  # genuine failure — missing findings after a real review, or a GitHub error
  # that survives the body-only retry — FAILS this phase visibly; a legitimate
  # `skip` succeeds without posting. Idempotent on resume (no-op if a bot review
  # already exists on the head SHA).
  - name: post-review
    label: Post inline review
    type: post-review
    # `all_success` (the default) is deliberate here where `review` uses
    # `all_done`: a failed review must NOT post.
    depends_on: [review]
