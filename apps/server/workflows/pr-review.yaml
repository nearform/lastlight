kind: review
name: pr-review
# Crosses the PR-scoped dispatch gate: the run lock shared with every other
# PR-scoped workflow, per-head-SHA dedup, escalation, and the resolved
# `PrState` snapshot on `context.prState`. A fork that drops the key loses all
# four.
pr_scoped: true
git_access: review-write
workspace: per-target-reuse
prepopulate_pr_head_ref: true
classification:
  intent: review
  description: |
    REVIEW — The user wants a code review. Either repo-wide ("review cliftonc/repo", "check PRs", "can you review PRs on <repo>?") OR, when the comment is a reply on a PR (ISSUE TITLE present), a request to review THIS PR: "review this", "can you review this?", "please review", "take a look at this PR", "give this a review". Asking the bot to APPROVE or sign off THIS PR is also REVIEW — "can you approve this?", "approve this PR", "please approve", "can you sign this off?", "give it a green tick" — because a review is the only way the bot approves a PR (it approves when the review finds nothing to raise). The deliverable is a formal PR review (inline comments on the diff). Prefer REVIEW over CHAT whenever there's a clear "review"/"take a look"/"approve this PR" request on a PR.
  examples:
    - '"please review https://github.com/foo/bar/pull/42" → INTENT: REVIEW, REPO: foo/bar, ISSUE: 42, REASON: NONE'
    - '"can you review this?" with ISSUE TITLE "Add HTML sanitizer for messages" → INTENT: REVIEW, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - '"take a look at this PR when you get a chance" with ISSUE TITLE "Port fastify adapter" → INTENT: REVIEW, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - '"can you approve this?" replying on an existing PR with ISSUE TITLE "fix(backend): stop formSync reverting saves" → INTENT: REVIEW, REPO: NONE, ISSUE: NONE, REASON: NONE'
chat:
  trigger: review PRs on owner/repo
  summary: Review the open PRs on a repo
  deflect:
    - review PRs on <repo>
    - check open PRs
description: |
  Review a single pull request: read the diff, check for issues, and post one
  formal review. Never modifies code.

phases:
  # HOW MUCH REVIEW IS THIS PUSH OWED? (issue #378) — the new root, and the only
  # phase that runs before the workspace is put to work.
  #
  # A RE-REVIEW only. On a first review there is nothing to compare against, so
  # `reviewIsRereview != true` skips the phase and the full brief runs. Both
  # guards use the BARE-BOOLEAN `!= true` form deliberately: that form runs an
  # absent value through `coerceBool`, so a missing or misspelled context key
  # matches the guard and the phase skips — leaving a full review. The
  # quoted-string form has the opposite behaviour and must not be used here.
  #
  # NOT with the evidence pipeline on (issue #429): a light run is one
  # agent pass over the diff with no ledger and no convergence gate — exactly
  # the unbounded re-review that re-opens code the last review already had.
  # The pipeline scopes a re-review in code instead (`units --prior`): a
  # small push is a few changed units, so few sites, and a push that changed
  # nothing the last review had plans no site at all. `analysisEnabled == true`
  # is the bare-boolean form, so an absent key does NOT match and triage runs
  # as before on a deployment without the pipeline.
  #
  # The phase ends with one `REVIEW_DEPTH: full|light` line, which
  # `engine/review-triage.ts` harvests onto `scratch.reviewTriage` from the same
  # `onPhaseEnd` hook the fix markers ride. On `light`, the seven phases below
  # skip and `prompts/review.md` renders its single-pass arm. On `full`, on no
  # marker, or on a failed phase, the dispatch-time seed stands and the run is
  # exactly what it is today.
  - name: triage
    label: Triage · how much review is owed
    prompt: prompts/review-triage.md
    model: "{{models.review-triage}}"
    skip_if:
      - "triageEnabled != true"
      - "reviewIsRereview != true"
      - "analysisEnabled == true"
    timeout_seconds: { from: triageTimeoutSeconds }
    # NO `on_output.requires_marker`, deliberately — see AC2 in
    # `tests/workflows/pr-review-probes.test.ts`: nothing in this workflow may
    # declare an `on_output` action, because a red run posts
    # `messages.on_failure`, offers a Retry that cannot succeed, pollutes the
    # cost stats and defeats the SHA dedup. A missing marker already means
    # "full review" — the harvest leaves the dispatch-time seed standing — so
    # failing the run over one would trade a free correct answer for a broken
    # review.

  # Everything from here up to `reconcile` is the evidence pipeline, and all of
  # it is INERT unless `review.analysis.enabled` — each phase carries
  # `skip_if: analysisEnabled != true`, and an absent variable reads as false,
  # so a typo skips the analysis rather than running an unasked-for one.
  #
  # The one analysis path: facts → seed → the unit survey → the `sites` review
  # engine → reconcile. `prepare`, `probe-plan` and `falsify` are kept but NOT
  # ATTACHED (`falsifyAttached != true` — no code projects the key): nothing in
  # the sites engine reads their output yet, and wiring them back in is its own
  # measured change (docs/plans/pr-review-units-sites.md, stage 5).
  #
  # Each also carries the TIER guard, `scratch.reviewTriage.depth == 'light'`.
  # Quoted `==` there, the mirror image of the bare-boolean form above: an
  # absent value never matches, so the phase RUNS — again failing toward a full
  # review. `post-review` carries no tier guard and always runs; `review` runs
  # unless the pipeline replaces it (see its own `skip_if`), and always runs on
  # `light`.
  - name: prepare
    label: Prepare · probe environment
    type: bash
    # `all_done`, not `all_success`: `triage` skips on a first review and on
    # every deployment that turned it off, and a skipped node is not
    # `succeeded`. A triage phase that FAILED must not take the review with it
    # — the run then owes a full review, which is what the un-replaced seed
    # already says.
    depends_on: [triage]
    trigger_rule: all_done
    skip_if:
      - "analysisEnabled != true"
      - "probesEnabled != true"
      - "falsifyAttached != true"
      - "scratch.reviewTriage.depth == 'light'"
    timeout_seconds: { from: probePhaseTimeoutSeconds }
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      OUT=.lastlight/pr-review/probes/env.json
      mkdir -p .lastlight/pr-review/probes

      # `installed` is read off the filesystem even here: a dead process still
      # leaves whatever it unpacked, and that is the only question asked later.
      fallback() {
        if [ -d node_modules ]; then INSTALLED=true; else INSTALLED=false; fi
        printf '{"version":1,"generatedAt":"%s","repo":"{{owner}}/{{repo}}","packageManager":null,"install":"failed","installed":%s,"lifecycleScripts":false,"typecheck":"failed","typecheckDiagnostics":[],"coverage":"failed","coverageReport":null,"durationMs":{"install":0,"typecheck":0,"coverage":0,"total":0},"degraded":[{"extractor":"prepare","reason":"%s"}]}\n' \
          "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" "$INSTALLED" "$1" > "$OUT"
      }

      ARGS="--repo . --out $OUT"
      # The INSTALL decision, and the only one whose default direction is
      # inverted: anything that is not the literal "true" adds `--no-install`,
      # so `probes: static` — and an absent value — prepares the tree without
      # ever running a package manager. `env.json` then says
      # `install: "skipped"` with `installed` still read off the filesystem,
      # which is the one field `falsify` branches on.
      [ "{{probeInstall}}" != "true" ] && ARGS="$ARGS --no-install"
      # Each switch arrives as the literal "true"/"false"; absent means off.
      [ "{{probeLifecycleScripts}}" = "true" ] && ARGS="$ARGS --lifecycle-scripts"
      [ "{{probeTypecheck}}" = "true" ] && ARGS="$ARGS --typecheck"
      [ "{{probeCoverage}}" = "true" ] && ARGS="$ARGS --coverage"

      if ! "$FACTS" prepare $ARGS --never-fail; then
        fallback "the prepare process died without writing env.json (OOM, or a CLI that could not be executed) — dependencies may be absent or partial, so NOTHING downstream may read a thin analysis as evidence that there is nothing to find"
      fi
      echo "prepare: $(wc -c < "$OUT" 2>/dev/null || echo 0) bytes"

  - name: facts
    label: Facts · deterministic
    type: bash
    skip_if:
      - "analysisEnabled != true"
      - "scratch.reviewTriage.depth == 'light'"
    # `all_done`, not `all_success`: `prepare` SKIPS wherever probes are off,
    # and a skipped node is not `succeeded`.
    depends_on: [prepare]
    trigger_rule: all_done
    timeout_seconds: { from: factsTimeoutSeconds }
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      OUT=.lastlight/pr-review/facts.json
      mkdir -p .lastlight/pr-review

      # The fallback envelope must VALIDATE — `seed` rejects a malformed one —
      # so that a failure reads downstream as "nothing was analysed" rather
      # than as "nothing was found".
      fallback() {
        printf '{"version":2,"generatedAt":"%s","extractor":"all","repo":"{{owner}}/{{repo}}","baseSha":"%s","headSha":"%s","tier":3,"engine":"none","languages":[],"coverage":"none","degraded":[{"extractor":"facts","reason":"%s"}],"toolchain":{"manifest":2,"bundled":{},"binaries":{}},"extractors":{}}\n' \
          "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" "${BASE:-unknown}" "$(git rev-parse HEAD 2>/dev/null || echo unknown)" "$1" > "$OUT"
      }

      # The MERGE BASE, never the base branch tip — a two-dot range attributes
      # every commit that landed on the base since the fork to this author. An
      # unresolvable base writes the fallback envelope; it never guesses.
      if ! BASE="$(git merge-base origin/{{baseBranch}} HEAD 2>/dev/null)" || [ -z "$BASE" ]; then
        fallback "no merge base between origin/{{baseBranch}} and HEAD (unrelated histories, or a clone too shallow to share one) — the diff range could not be established, so NOTHING here may be read as 'no findings'"
        echo "facts: no merge base — wrote a coverage:none envelope"
        exit 0
      fi

      # The shell-level catch covers what `--never-fail` cannot: a process that
      # DIES (OOM, a segfault in the native parser). `--stage-diff` writes the
      # per-file patches here, where the merge base is already resolved, so no
      # investigator has to derive the range again.
      if ! "$FACTS" all --repo . --base "$BASE" --head HEAD --out "$OUT" --stage-diff --never-fail; then
        fallback "the analysis process died without writing an envelope (OOM, a segfault in the native parser, or a compiler binary that cannot exec) — NOTHING here may be read as 'no findings'"
      fi
      echo "facts: $(wc -c < "$OUT" 2>/dev/null || echo 0) bytes, base $BASE"
      # Logged separately so "nothing was staged" and "the investigators never
      # found it" are two lines rather than one silence.
      if [ -s .lastlight/pr-review/diff/index.md ]; then
        echo "facts: staged $(ls .lastlight/pr-review/diff/*.patch 2>/dev/null | wc -l) per-file patch(es) under .lastlight/pr-review/diff/"
      else
        echo "facts: NO staged diff — every investigator will have to derive the range itself"
      fi

  - name: seed
    label: Seed · obligations
    type: bash
    skip_if:
      - "analysisEnabled != true"
      - "scratch.reviewTriage.depth == 'light'"
    depends_on: [facts]
    trigger_rule: all_done
    timeout_seconds: { from: seedTimeoutSeconds }
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      CONTRACT="{{obligationContract}}"
      MAX_OBLIGATIONS="{{maxObligations}}"
      # Read into a variable, never interpolated straight into the arg list: an
      # absent {{key}} renders EMPTY and would swallow the following flag.
      # Passed only when non-empty — the CLI refuses an empty --mint.
      MINT="{{mint}}"
      mkdir -p .lastlight/pr-review/hypotheses
      set -- seed --facts .lastlight/pr-review/facts.json \
        --out .lastlight/pr-review/obligations.json \
        --contract "${CONTRACT:-minimal}" \
        --max-obligations "${MAX_OBLIGATIONS:-48}"
      if [ -n "$MINT" ]; then set -- "$@" --mint "$MINT"; fi
      "$FACTS" "$@" || true
      echo "seed: contract ${CONTRACT:-minimal} backstop ${MAX_OBLIGATIONS:-48} mint ${MINT:-none}"
      if [ -s .lastlight/pr-review/obligations.json ]; then
        echo "seed: obligations.json $(wc -c < .lastlight/pr-review/obligations.json) bytes"
      else
        echo "seed: obligations.json MISSING — every unit will be cut with no obligation"
      fi
      exit 0

  # ── The unit survey (docs/plans/pr-review-units-sites.md) ─────────────────────────────
  #
  # Three phases that end in `hypotheses/<family>.jsonl` — the rows `site-plan`
  # clusters into sites:
  #
  #   units         deterministic: cut the PR into units (a symbol, a module
  #                 region, the PR itself) and render each one's COMPLETE
  #                 request — code, neighbours, obligations, questions, schema.
  #   survey-units  in-process: ONE bounded, non-agentic model call per unit,
  #                 concurrently. No sandbox, no tools, no re-deriving with
  #                 bash what `facts`/`seed` already computed.
  #   units-ingest  deterministic: validate every response, write the
  #                 hypothesis rows. A unit that never answered is RECORDED —
  #                 each obligation it owned gets a row saying so — never
  #                 dropped.
  #
  # `all_done` down the chain, like every deterministic phase here: `units`
  # always writes a document (the shell fallback included), and `units-ingest`
  # must run even when the calls failed — that is when it has the most to
  # record.
  - name: units
    label: Units · deterministic
    type: bash
    skip_if:
      - "analysisEnabled != true"
      - "scratch.reviewTriage.depth == 'light'"
    depends_on: [seed]
    trigger_rule: all_done
    # `facts`' own budget: the same class of analysis over the same tree, and a
    # context key rather than a literal like every budget here (#385).
    timeout_seconds: { from: factsTimeoutSeconds }
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      OUT=.lastlight/pr-review/units.json
      SPEC=.lastlight/pr-review/spec-obligations.json
      PRIOR=.lastlight/pr-review/prior-review.json
      RISK=.lastlight/pr-review/risk-rules.json
      mkdir -p .lastlight/pr-review
      # A reused per-PR workspace still holds the LAST head's document. Remove
      # it first, so a process that dies before writing leaves no stale units
      # for `survey-units` to spend money on — and no stale prior review or
      # risk rules for this run to scope by.
      rm -f "$OUT" "$SPEC" "$PRIOR" "$RISK"

      # Issue #429 — the units the LAST review had (the PR's review ledger),
      # so each unit gets a `delta` (new / changed / affected / unchanged) and
      # the sites skip what is unchanged. Absent on a first review: nothing is
      # scoped. Same QUOTED heredoc as the spec obligations below.
      {{#if priorReviewJson}}
      cat > "$PRIOR" <<'LASTLIGHT_PRIOR_EOF'
      {{priorReviewJson}}
      LASTLIGHT_PRIOR_EOF
      {{/if}}
      # …and the configured risk rules (the repo's, then the operator's).
      {{#if riskRulesJson}}
      cat > "$RISK" <<'LASTLIGHT_RISK_EOF'
      {{riskRulesJson}}
      LASTLIGHT_RISK_EOF
      {{/if}}
      set --
      [ -s "$RISK" ] && set -- --risk-rules "$RISK"
      if [ -s "$PRIOR" ]; then echo "units: re-review — scoping against the last review's units"; fi

      # The spec obligations are built HARNESS-side (the PR body and the issues
      # it closes; `review-spec.ts`), so they reach the sandbox only through
      # this command: the raw set, as the one line of JSON `specContext`
      # projects, for `units` to cut into units. QUOTED heredoc — nothing in it
      # is expanded — and the value is one line, so it can never be the
      # delimiter line. No set (nothing to say, nothing degraded) writes no
      # file; the `rm` above already removed a stale one.
      {{#if specObligationsJson}}
      cat > "$SPEC" <<'LASTLIGHT_SPEC_EOF'
      {{specObligationsJson}}
      LASTLIGHT_SPEC_EOF
      {{/if}}
      if [ -s "$SPEC" ]; then
        echo "units: spec obligations written, $(wc -c < "$SPEC") bytes"
      else
        echo "units: no spec obligations for this PR"
      fi

      # The fallback must read downstream as "nothing was cut into units", never
      # as "there was nothing to survey": `coverage: none`, the reason in
      # `degraded[]`, and an EMPTY `units` array `survey-units` accepts.
      fallback() {
        printf '{"version":1,"generatedAt":"%s","baseSha":null,"headSha":"%s","promptVersion":null,"coverage":"none","degraded":[{"extractor":"units","reason":"%s"}],"responseSchema":null,"units":[]}\n' \
          "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" "$(git rev-parse HEAD 2>/dev/null || echo unknown)" "$1" > "$OUT"
      }

      # `--never-fail` covers what the CLI can see; the shell covers a process
      # that DIES (OOM, a segfault in the native parser). The fallback is
      # written only when nothing was — a document the CLI wrote on its way to
      # a non-zero exit carries more than this one can.
      "$FACTS" units --dir .lastlight/pr-review --repo . "$@" --never-fail
      CODE=$?
      if [ ! -s "$OUT" ]; then
        fallback "the units process exited $CODE without writing units.json (OOM, a segfault in the native parser, or a CLI that could not be executed) — NOTHING here may be read as 'no findings'"
      fi
      N=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).units.length)' "$OUT" 2>/dev/null || echo "?")
      echo "units: exit $CODE, $N unit(s), $(wc -c < "$OUT" 2>/dev/null || echo 0) bytes"
      exit 0

  # One call per unit, in the HARNESS process (`handlers/survey-units.ts`).
  # The system prompt of every call is `prompt:` plus the document's
  # byte-identical `sharedPrefix` (so Anthropic's system-prompt cache
  # breakpoint covers both), and the user message is the rest of the unit's
  # request; with no usable prefix, the request goes verbatim. Concurrency is
  # `review.analysis.surveyUnitConcurrency`. Replies are cached outside the
  # workspace, keyed on the resolved endpoint, thinking level, system text and
  # request, so a re-review re-asks only the units whose request changed — and
  # a reply `units-ingest` judged invalid/partial is evicted before the next
  # run. One transcript and one `executions` row for the phase.
  #
  # It SUCCEEDS on every path inside the phase — no units, no units.json, every
  # call failing, the deadline — with a loud summary, because a red phase here
  # posts nothing and re-arms the review sweep, while `units-ingest` already
  # records every unanswered obligation. The one unsupported setup (kubernetes:
  # no host checkout) is refused at config load instead — with it, the whole
  # analysis pipeline.
  - name: survey-units
    label: Survey · one call per unit
    type: survey-units
    prompt: prompts/survey-unit.md
    model: "{{models.review-survey}}"
    # Thinking level, resolved like every agent phase's (`variants.<key>`, then
    # the resolver's per-phase / catch-all default). Part of the cache key.
    variant: "{{variants.review-survey}}"
    # The WHOLE-PHASE deadline (every unit call shares one AbortController);
    # a unit not finished by then is recorded `ok: false`, "phase deadline".
    timeout_seconds: { from: surveyUnitsTimeoutSeconds }
    skip_if:
      - "analysisEnabled != true"
      - "scratch.reviewTriage.depth == 'light'"
    depends_on: [units]
    trigger_rule: all_done

  - name: units-ingest
    label: Units · ingest
    type: bash
    skip_if:
      - "analysisEnabled != true"
      - "scratch.reviewTriage.depth == 'light'"
    depends_on: [survey-units]
    trigger_rule: all_done
    timeout_seconds: { from: seedTimeoutSeconds }
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      mkdir -p .lastlight/pr-review/hypotheses
      if ! "$FACTS" units-ingest --dir .lastlight/pr-review --never-fail; then
        echo "units-ingest: the ingest process died — hypotheses/ holds whatever it wrote before; site-plan reads what is there"
      fi

      # The POST-CHECK: every seeded obligation carries a discharge, and every
      # row gets the canonical id rewrite (issue #405). `spec` is graded
      # `--ungraded` — its obligations are not in obligations.json.
      # REPORTED, never failed on: there is no agent to hand a gate failure
      # back to, and ingest has already written an unanswered row for every
      # obligation a unit could not answer — a red phase here would only paint
      # the run red over a gap that is already on the record.
      for FAMILY in contract enforcement security state spec; do
        if [ "$FAMILY" = spec ]; then set -- --ungraded; else set --; fi
        if RESULT="$("$FACTS" discharge --dir .lastlight/pr-review --family "$FAMILY" "$@" 2>&1)"; then
          echo "discharge $FAMILY: ok"
        else
          echo "discharge $FAMILY: NOT satisfied"
          printf '%s\n' "$RESULT" | head -n 20
        fi
      done
      exit 0

  # ── The `sites` review engine (docs/plans/pr-review-units-sites.md) ──────────
  #
  # The hypothesis rows are not the items the review weighs; they are a VOLUME
  # signal: where many independent units pointed is where an investigator
  # looks.
  #
  #   site-plan    deterministic: rank sites (distinct-unit votes, span ≤ 60,
  #                test-file sites last), one brief per slot.
  #   site-review  fan-out: one investigator per selected site writes 1–3
  #                grounded findings, or a probe-backed `none`.
  #   merge        deterministic: pool the findings, propose duplicate groups.
  #   select       one agent call: merge true duplicates, set importance,
  #                write the comments.
  #   site-finalize deterministic: `sites --finalize` → findings.json (every
  #                row `internal`); then `reconcile`'s usual floor.
  #
  # `all_done` down the chain: each step must run on whatever the last one
  # left, and the floor in `reconcile` covers a failed `select`.
  - name: site-plan
    label: Sites · plan
    type: bash
    skip_if:
      - "analysisEnabled != true"
      - "scratch.reviewTriage.depth == 'light'"
    depends_on: [units-ingest]
    trigger_rule: all_done
    timeout_seconds: { from: seedTimeoutSeconds }
    # Writes `sites/plan.json`, one brief per slot (`sites/site-001.md` …) and
    # `sites/branches.json`, the manifest `site-review` fans out over (it
    # clears `sites/` first — a reused workspace holds the last head's). One
    # slot per ranked site, up to `siteTop`; with `models.review-site-pair`
    # set, a second slot per site, `site-00N-b`, on that model. A PR with two
    # sites plans two investigators, not sixteen.
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      # Test-then-flag: an absent {{key}} renders EMPTY and would swallow the
      # following flag.
      TOP="{{siteTop}}"
      set --
      [ -n "$TOP" ] && set -- "$@" --top "$TOP"
      {{#if models.review-site-pair}}set -- "$@" --pair{{/if}}
      "$FACTS" sites --plan "$@" --dir .lastlight/pr-review --never-fail
      exit 0

  # One investigator per site, concurrently, in one workspace. The branch list
  # is DYNAMIC: `branches_from` reads the manifest `site-plan` just wrote and
  # renders `branch:` once per item (`{{item.id}}`, `{{item.pair}}`). The prompt
  # is slot-generic: the attached brief names the site id, the one file the branch writes
  # (`sites/<site id>.findings.jsonl` — disjoint across branches, which is the
  # fan-out's isolation model) and how many probed suspicions a `none` needs.
  # The gate is the one the evals replay graded (`sites --check`), and
  # `on_branch_gate_failure` hands its gaps back once — the round-2 feedback the
  # replay built by hand.
  - name: site-review
    label: Sites · investigate
    type: fanout
    prompt: prompts/review-site.md
    # Its own key, falling through to the survey model. The `{{#if}}` pair is
    # load-bearing: a bare unset key renders EMPTY, and an empty model falls
    # back to the DEFAULT model rather than to `models.review-survey`.
    model: "{{#if models.review-site}}{{models.review-site}}{{/if}}{{#if !models.review-site}}{{models.review-survey}}{{/if}}"
    skip_if:
      - "analysisEnabled != true"
      - "scratch.reviewTriage.depth == 'light'"
    depends_on: [site-plan]
    trigger_rule: all_done
    # `review.analysis.siteConcurrency`, clamped per backend (gondolin pins to
    # 1 — the sites then run in series).
    max_concurrent: { from: siteConcurrency, default: 6 }
    # An investigator RUNS code — copied lines under `node`, a differential
    # `git show` — and that is its evidence. Installing the repo and the suite
    # are never a probe; scratch installs follow falsify's switch, and `block`
    # when probes are off (the key is projected only with probes on — the
    # sites engine does not need them).
    command_policy:
      install: block
      install-scratch: { from: probeScratchInstallPolicy, default: block }
      test: block
      host: block
      reason: >-
        Installing the repository's dependencies is not this pass's job, and the whole
        suite is never a probe. Run the one targeted check the site needs (a copied
        function under `node`, a differential `git show`), or report what you read.
        Nothing outside the checkout counts.
    on_branch_soft_failure: { retries: 1, then: complete }
    on_branch_gate_failure: { retries: 1 }
    # `max` is the spend cap: top 8, paired. More items than that are dropped,
    # loudly — `site-plan` never writes more.
    branches_from:
      file: .lastlight/pr-review/sites/branches.json
      max: 16
    branch:
      name: "{{item.id}}"
      # A pair slot runs on `models.review-site-pair`; a primary renders empty
      # here and so takes the phase's `model:` above.
      model: "{{#if item.pair}}{{models.review-site-pair}}{{/if}}"
      context_file: ".lastlight/pr-review/sites/{{item.id}}.md"
      until_bash: |
        FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
        "$FACTS" sites --check {{item.id}} --dir .lastlight/pr-review --repo .
  # Pool every site's findings for `select`: numbered `F1…Fn`, each with an
  # excerpt, and the duplicate groups line proximity PROPOSES (it cannot decide
  # "same defect"; no rule here reads prose). STDOUT is the delivery mechanism
  # — `output_var` puts it in the select prompt — and `sites/merged.json` is
  # what `--finalize` reads.
  - name: merge
    label: Sites · merge
    type: bash
    skip_if:
      - "analysisEnabled != true"
      - "scratch.reviewTriage.depth == 'light'"
    depends_on: [site-review]
    trigger_rule: all_done
    output_var: siteMerge
    timeout_seconds: { from: reconcileTimeoutSeconds }
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      if ! "$FACTS" sites --merge --dir .lastlight/pr-review --repo . --never-fail; then
        echo "MERGE NOT AVAILABLE — \`lastlight-facts sites --merge\` failed. Write {\"items\": []}."
      fi
      exit 0

  # One agent call over at most ~15 findings: merge true duplicates, set
  # importance, write the comments to `sites/selected.json`. The gate is
  # conservation — every pooled finding in exactly one item — so selecting can
  # merge and demote (`nit` is recorded, never posted) but never silently drop.
  # A selection that never closes is not fatal: `sites --finalize` falls back
  # to one item per finding at the investigator's own importance.
  #
  # Skipped when `merge` pooled nothing (its FIRST line is `SITE_MERGE_EMPTY`;
  # `startsWith`, because a finding's code excerpt can quote the marker): the one
  # correct selection is empty, `--finalize` falls back to the empty pool, and
  # an agent asked to write it wrote the file and then an empty completion,
  # failing the phase and its retry. A resumed run has no `siteMerge` output
  # (a dedup skip returns none), so select runs — the safe direction.
  - name: select
    label: Sites · select
    prompt: prompts/review-select.md
    model: "{{#if models.review-select}}{{models.review-select}}{{/if}}{{#if !models.review-select}}{{models.review}}{{/if}}"
    variant: "{{variants.review}}"
    skip_if:
      - "analysisEnabled != true"
      - "scratch.reviewTriage.depth == 'light'"
      - "phaseOutputs.siteMerge.startsWith('SITE_MERGE_EMPTY')"
    depends_on: [merge]
    trigger_rule: all_done
    command_policy:
      install: block
      test: block
      host: block
      reason: >-
        This phase selects; it does not verify. The investigators already ran their
        probes — read their findings above, and the code only to decide whether two
        findings are the same defect.
    generic_loop:
      on_soft_failure: { retries: 1, then: complete }
      max_iterations: 2
      fresh_context: true
      until_bash: |
        FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
        "$FACTS" sites --check-select --dir .lastlight/pr-review

  # `select`'s file → findings.json, the shape `post-review` reads: each item at
  # its primary finding's location (with the line's text as `existingCode`, so
  # the poster anchors it), severity from importance (must-fix outranks
  # worth-mentioning for the inline slots; a `nit` is filed `internal`), and
  # every hypothesis row by id in `internal[]` — the rows are the volume
  # record, and `reconcile`'s conservation check then holds. A missing or
  # invalid selection falls back to one item per site finding at the
  # investigator's own importance, so a failed `select` still posts.
  - name: site-finalize
    label: Sites · findings.json
    type: bash
    skip_if:
      - "analysisEnabled != true"
      - "scratch.reviewTriage.depth == 'light'"
    depends_on: [select]
    trigger_rule: all_done
    timeout_seconds: { from: reconcileTimeoutSeconds }
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      if ! "$FACTS" sites --finalize --dir .lastlight/pr-review --repo .; then
        echo "site-finalize: sites --finalize failed; reconcile's floor files every hypothesis internal"
      fi
      exit 0

  # WHICH hypotheses `falsify` owes a verdict on — decided in code, not by the
  # oracle. `lastlight-facts probe-plan` derives the owed set (a derived-Critical
  # row, or a survey's own `needsProbe`), ranks it and caps it at
  # `review.analysis.maxProbes`, writing `probes/plan.json` (the `probes` gate
  # owes exactly that list) and `probes/plan.md` (the records falsify reads).
  # The prompt used to say "probe every row whose severity is Critical", and a
  # derived severity is never written on a row: measured 2026-09-27, the gate
  # owed 21 rows on one case and falsify probed one. `--never-fail`: with no
  # plan on disk the gate and the prompt fall back to the pre-plan owed set, so
  # a failure here costs the cap, never a probe.
  - name: probe-plan
    label: Falsify · plan the probes
    type: bash
    skip_if:
      - "analysisEnabled != true"
      - "probesEnabled != true"
      - "falsifyAttached != true"
      - "scratch.reviewTriage.depth == 'light'"
    depends_on: [units-ingest]
    trigger_rule: all_done
    timeout_seconds: { from: seedTimeoutSeconds }
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      MAX_PROBES="{{maxProbes}}"
      if [ -z "$MAX_PROBES" ] || [ "$MAX_PROBES" = "null" ]; then set --; else set -- --max-probes "$MAX_PROBES"; fi
      "$FACTS" probe-plan --dir .lastlight/pr-review "$@" --never-fail

  # The only phase that RUNS anything. It reads the hypothesis RECORDS and the
  # code, never an earlier pass's transcript — a checker that can see the
  # reasoning which produced a claim almost never rejects it.
  - name: falsify
    label: Falsify · run the probe
    prompt: prompts/review-falsify.md
    # Its OWN key, falling through to `models.review-survey`, so the oracle's
    # model moves without the survey's. The `{{#if}}` pair is load-bearing, as
    # on `site-review`.
    model: "{{#if models.review-falsify}}{{models.review-falsify}}{{/if}}{{#if !models.review-falsify}}{{models.review-survey}}{{/if}}"
    skip_if:
      - "analysisEnabled != true"
      - "probesEnabled != true"
      - "falsifyAttached != true"
      - "scratch.reviewTriage.depth == 'light'"
    # `all_done`: a FAILED plan step never stopped falsify, which then reads
    # the pre-plan owed set (see `probe-plan` above).
    depends_on: [probe-plan]
    trigger_rule: all_done
    # A WHOLE-PHASE ceiling, across every round. `probeRounds` bounds how many
    # times the loop may go round and not what it may spend, and this is the
    # one phase in the pipeline that executes code — so it is the one that
    # needs a wall-clock bound rather than a count. Like every other budget
    # here it names a context key, never a literal (#385).
    timeout_seconds: { from: falsifyTimeoutSeconds }
    # The one phase that runs code, and even here installing the repo is
    # `prepare`'s job, never the model's. Whether a TEST can run depends on
    # whether `prepare` installed the tree, so those two modes are read from
    # the run context: `probes: full` → `log` (a targeted test is the point;
    # a reach for the whole suite shows up in the logs), `probes: static` →
    # `block` (nothing is installed, so it cannot work). A scratch-dir install
    # (`npm install fastify@5` in /tmp/probe) follows the same switch.
    #
    # `host` (issue #404) is `log` here for one eval arm, then `block` once the
    # log shows nothing legitimate is caught: measured, 24 of 27 out-of-workspace
    # commands came from falsify hunting a dependency on the host (`find /`,
    # `~/.nvm`, a global `lastlight` put on PATH).
    command_policy:
      install: block
      install-scratch: { from: probeScratchInstallPolicy }
      test: { from: probeTestPolicy }
      host: log
      reason: >-
        Installing the repository's dependencies is the prepare phase's job, and the
        whole suite is never a probe. Run the one targeted check this hypothesis needs
        (a single test file, `node -e`, an AST or facts query), or record the
        hypothesis as unprobed.
    generic_loop:
      on_soft_failure: { retries: 1, then: complete }
      max_iterations: { from: probeRounds, default: 2 }
      # An EXISTENCE check, satisfiable in one honest pass: a hypothesis that
      # cannot be executed against is recorded `unprobed` and carried forward
      # with lowered confidence. Literal shell — `validateShellCommand`
      # rejects any command containing `{{`.
      until_bash: |
        FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
        "$FACTS" probes --dir .lastlight/pr-review

  # Writes findings to `.lastlight/pr-review/findings.json` — content only —
  # and never submits; `post-review` below does that. Two arms of one prompt:
  # the whole review with the pipeline OFF (`baseline`), and the single pass a
  # `light` re-review gets.
  #
  # With the pipeline ON it does not run: `site-finalize` writes findings.json.
  # The guard is ONE scratch flag because `skip_if` lists are OR-ed and the
  # condition is an AND — pipeline on, depth not `light`. `runner.ts` seeds
  # `skipReview` for the first, and the light harvest REPLACES the namespace,
  # which drops the flag: a light review runs this phase. A context-key guard
  # would survive the harvest, and a light review would then post nothing.
  # Bare `== true`, so an absent flag (a run seeded before the key existed, a
  # failed seed) runs the review — the direction every failure here points.
  - name: review
    label: Review
    # EXPLICIT: declaring `depends_on` anywhere disables the synthesized linear
    # chain for the WHOLE workflow, so without these two lines `review` and
    # `post-review` become roots and run in parallel with the pipeline. And
    # `all_done`, because with `all_success` they would be skipped on every
    # deployment that has not enabled the pipeline.
    depends_on: [site-finalize, falsify]
    trigger_rule: all_done
    skip_if:
      - "scratch.reviewTriage.skipReview == true"
    prompt: prompts/review.md
    skills: [pr-review, code-review]
    model: "{{models.review}}"
    variant: "{{variants.review}}"
    # Review re-created CI by hand (`npm ci` then `npm run lint:check && npm
    # test`) although `{{ciSection}}` already carries the result (issue #403),
    # so the suite is blocked everywhere. An INSTALL is blocked only when the
    # evidence pipeline is on — a light re-review there is a focused read. With
    # it off this is the whole review, and the
    # `pr-review` skill's install-to-probe affordance is a measured fix (it is
    # why the reviewer could open `node_modules/@slack` at all), so it stays.
    command_policy:
      install: { from: reviewInstallPolicy, default: allow }
      test: block
      host: block
      reason: >-
        This phase does not run the build, the linter or the test suite: CI already
        answered those, in the Context section. Cite it, or report the claim as
        unverified. Nothing outside the checkout counts: never search the
        machine for a missing dependency — stop, and leave the claim unprobed.

  # The conservation floor under `site-finalize`: `--repair` writes every
  # hypothesis findings.json does not account for at `internal` tier, so a
  # failed or partial finalize never loses a row. Idempotent, model-free, and
  # exits 0 on every path.
  #
  # It is also where a hypothesis-derived finding's SEVERITY is derived (issue
  # #405): the severity its evidence records and probe verdicts imply
  # (`finding-severity.ts`). `post-review` ranks both posting budgets on it.
  - name: reconcile
    label: Reconcile · the conservation floor
    type: bash
    skip_if:
      - "analysisEnabled != true"
      - "scratch.reviewTriage.depth == 'light'"
    depends_on: [site-finalize]
    # `all_done`: the floor must apply even when finalize failed — that is
    # precisely when there is something to repair.
    trigger_rule: all_done
    timeout_seconds: { from: reconcileTimeoutSeconds }
    command: |
      set -u
      FACTS="${LASTLIGHT_FACTS_BIN:-$(command -v lastlight-facts || echo /opt/lastlight/bin/lastlight-facts)}"
      if ! "$FACTS" findings --dir .lastlight/pr-review --repair; then
        echo "reconcile: could not repair findings.json; it stands as site-finalize wrote it"
      fi
      exit 0

  # In-process submission. Reads findings.json for the review CONTENT and
  # supplies the rest from the harness itself — PR number, base ref, head SHA
  # and diff — so the agent never hand-copies metadata. Anchors each finding to
  # a changed line, demotes off-diff findings to the body, and posts one
  # review. Idempotent on resume.
  #
  # `none_failed` on `review` alone:
  #
  #   - a FAILED `review` never posts — a failed dep fails the rule;
  #   - a `review` SKIPPED by its own guard (pipeline on) posts what
  #     `site-finalize` + `reconcile` wrote — the default rule, `all_success`,
  #     would skip this phase with it and post nothing;
  #   - a failed `select`, `site-finalize` or `reconcile` still posts —
  #     the money property: a red run that posts nothing leaves both per-head
  #     dedups blank, and the thirty-minute sweep re-buys the whole pipeline
  #     on the same SHA forever. That is why this does NOT also depend on
  #     `reconcile`: `none_failed_min_one_success` over both would withhold the
  #     post whenever `reconcile` itself failed.
  #
  # So the floor runs before the post by DECLARATION ORDER — every pipeline
  # phase is declared earlier and the sequential scheduler takes the earliest
  # ready node — exactly as it did while `review` always ran.
  - name: post-review
    label: Post inline review
    type: post-review
    depends_on: [review]
    trigger_rule: none_failed
