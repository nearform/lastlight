kind: pr-fix
name: dependabot-ci-fix
# Crosses the PR-scoped dispatch gate: the run lock shared with every other
# PR-scoped workflow, per-head-SHA dedup, escalation, and the resolved
# `PrState` snapshot on `context.prState`.
pr_scoped: true
git_access: repo-write
workspace: per-target-reuse
# Shares the fix family's ONE workspace per PR (`${repo}-${N}-fix`), which the
# run lock admits one of at a time.
pr_fix_shaped: true
description: |
  Fix a dependency-update PR (Dependabot / Renovate) that cannot merge on its
  own — CI is red, or it is `behind` its base / `dirty` / `blocked`. Brings the
  branch up to date, makes CI green, and pushes.

  It never classifies or merges: once the checks go green the
  `pr.checks_passed` webhook hands off to `dependabot-pr-merge`, the single
  owner of the classify → label → auto-merge decision. The one label it applies
  is `requires-human`, when it cannot land the PR at all.

status_checklist: true
classification:
  intent: dependabot-ci-fix
  description: |
    DEPENDABOTCIFIX — a dependency-update pull request (opened by Dependabot or
    Renovate, e.g. "Bump <pkg> from X to Y", "chore(deps): update <pkg>") whose
    CI checks have FAILED and needs its build / lockfile / call sites repaired so
    the update can land. Choose this over REVIEW or BUILD when the subject is a
    red dependency-bump PR. Also choose it when a maintainer's comment asks the
    bot to handle/look at/fix such a PR and `PR CHECKS` is `failing` (with a
    `PR AUTHOR` of dependabot[bot]/renovate[bot]) — but keep REVIEW when they
    explicitly ask for a review.
  examples:
    - 'PR "Bump lodash from 4.17.20 to 4.17.21" by dependabot[bot] — its CI checks have failed. → INTENT: DEPENDABOTCIFIX, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - 'PR "chore(deps): bump actions/checkout from 3 to 4" by dependabot[bot] — its CI checks have failed. → INTENT: DEPENDABOTCIFIX, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - 'PR AUTHOR: dependabot[bot], PR CHECKS: failing, COMMENT: "@bot can you take a look at this?" → INTENT: DEPENDABOTCIFIX, REPO: NONE, ISSUE: NONE, REASON: NONE'

phases:
  # Classify the failure against the pre-cloned workspace (cheap) BEFORE the
  # install + test cycle (expensive), so a failure no amount of fixing can
  # address costs one short call.
  - name: diagnose
    label: Diagnose the failing checks
    prompt: prompts/diagnose-ci.md
    skill: fixing
    model: "{{models.diagnose}}"
    output_var: diagnosis
    # Nothing to diagnose when the PR is not red: it is merge-BLOCKED, and the
    # repair is mechanical. Diagnosing anyway was harmful rather than wasteful —
    # this phase's taxonomy is CI-failure-shaped, so an agent seeing green
    # checks answers `infra-dependent`, which is one of the stopping classes the
    # fix phase skips on. `reason` carries CI's verdict first, so a PR that is
    # both red and behind still arrives as `checks-failing` and is diagnosed.
    skip_if:
      - "reason == 'dirty'"
      - "reason == 'behind'"
      - "reason == 'blocked'"
    # The tag WITH its colon, which is what the parser looks for. The engine
    # enforces the postcondition as a plain substring, so a bare tag lets an
    # output that merely MENTIONS it pass a gate that then parses to nothing.
    on_output:
      requires_marker: "DIAGNOSIS_COMPLETE:"
    messages:
      on_start: "Diagnosing the failing checks on PR #{{prNumber}}..."
      on_failure: "**Couldn't diagnose** the failing checks on PR #{{prNumber}}."

  - name: fix
    label: Fix failing checks
    prompt: prompts/dependabot-ci-fix.md
    skills: [fixing, building]
    model: "{{models.pr-fix}}"
    # The three stopping classes: there is nothing for a fix phase to do, so it
    # must not provision a sandbox and run a 900-second gate. A non-failing
    # skip — the run still records `succeeded`, so `on_failure` does not post
    # and the PR is never labelled `requires-human` for someone else's problem.
    #
    # Read off the PARSED class in `scratch`, never the phase's raw output:
    # prose like "this is not class=flaky" matches a substring, a replayed
    # attempt-journal line matches too, and `phaseOutputs` is EMPTY across a
    # resume boundary. `scratch` is reloaded from the run row.
    #
    # `flaky` is BOUNDED: after `fix.maxFlakyDeferrals` consecutive flaky
    # verdicts on the same problem the harness drops that row for the run, so
    # the next attempt treats it as reproducible. The match is literal.
    skip_if:
      - "scratch.fixMarkers.diagnosis.class == 'flaky'"
      - "scratch.fixMarkers.diagnosis.class == 'infra-dependent'"
      - "scratch.fixMarkers.diagnosis.class == 'upstream-broken'"
    # Load-bearing: the gate command otherwise inherits a 30-second default,
    # which kills any real test suite mid-run and reports a false red. Read
    # from the run's repo-clamped `fix:` block, with the packaged value as the
    # fallback for a context that carries none.
    timeout_seconds: { from: fix.gateTimeoutSeconds, default: 900 }
    on_output:
      requires_marker: "CI_FIX_COMPLETE:"
    generic_loop:
      max_iterations: { from: fix.localIterations, default: 2 }
      # `until` is checked FIRST and short-circuits the gate below entirely.
      # `pushed` is the one outcome that qualifies: the commit is on the branch
      # and GitHub's own checks are the better authority, so re-running the
      # suite locally can no longer change anything. `no-change` / `gave-up`
      # still pay for the gate — its RED verdict is what earns the next
      # iteration. The `tried=` needle matters: a bare `outcome=pushed` also
      # appears in a replayed attempt-journal line from an EARLIER attempt.
      until: "output.contains('outcome=pushed tried=')"
      # The gate command is not statically knowable — package manager from the
      # lockfile, commands from the repo's CI — so the agent writes it to
      # `.git/lastlight-verify.sh`, which `git add -A` can never commit. No
      # script means an explicit non-zero exit: a skipped gate is treated as
      # red and never authorises a push.
      #
      # `bash`, NOT `sh`. `/bin/sh` in the sandbox is dash, the script opens
      # `set -euo pipefail`, and dash exits 2 on line 2 — a constant red in
      # milliseconds, which burns every iteration and leaves the agent's own
      # self-report as the only thing gating the push.
      until_bash: "if [ -f .git/lastlight-verify.sh ]; then bash .git/lastlight-verify.sh; else echo 'no .git/lastlight-verify.sh — gate=skipped, treated as RED'; exit 1; fi"
      fresh_context: false
    messages:
      on_start: "On it — investigating the failing checks on PR #{{prNumber}}..."
      on_success: "**Fix pushed** to `{{branch}}`."
      on_failure: "**Couldn't auto-fix** the failing checks on PR #{{prNumber}} — leaving it for a human."
      on_skipped_done: "**No fix attempted** — the diagnosis says this isn't fixable from here. See the verdict above."
