kind: pr-fix
name: dependabot-ci-fix
description: |
  Fix a dependency-update PR (Dependabot / Renovate) that can't merge on its
  own — CI is red, or it's `behind` its base / `dirty` (merge conflict) /
  `blocked`: bring the branch up to date with its base, make CI green, and push.
  It never classifies or merges — once the pushed fix turns the checks green the
  `pr.checks_passed` webhook hands off to `dependabot-pr-merge`, the single owner
  of the classify → label → auto-merge decision. The one label it may apply is
  `requires-human`, when it can't land the PR (a fix it can't complete, or a
  `blocked` PR it can't unblock), so the nightly sweep stops re-attempting it.

  Triggered by:
    - pr.checks_failed webhook (a check_suite completed with a failure
      conclusion) → routed here by the classifier when it recognises a
      dependency-update PR (src/engine/router.ts + this file's `classification`).
    - cron-dependabot-ci-fix backstop (`discover: red-dependency-prs`) → fans
      out one run per PR whose checks are settled-failing OR whose
      `mergeable_state` is `behind` / `dirty` / `blocked`
      (src/cron/dependabot-discovery.ts). The `{{reason}}` says which.
# One in-place task-list comment that updates as the diagnose/fix phases run,
# rather than a comment per phase.
status_checklist: true
classification:
  intent: dependabot-ci-fix
  description: |
    DEPENDABOTCIFIX — a dependency-update pull request (opened by Dependabot or
    Renovate, e.g. "Bump <pkg> from X to Y", "chore(deps): update <pkg>") whose
    CI checks have FAILED and needs its build / lockfile / call sites repaired so
    the update can land. Choose this over REVIEW or BUILD when the subject is a
    red dependency-bump PR. Also choose it when a maintainer's comment asks the
    bot to handle/look at/fix such a PR and `PR CHECKS` is `failing` (with a
    `PR AUTHOR` of dependabot[bot]/renovate[bot]) — but keep REVIEW when they
    explicitly ask for a review.
  examples:
    - 'PR "Bump lodash from 4.17.20 to 4.17.21" by dependabot[bot] — its CI checks have failed. → INTENT: DEPENDABOTCIFIX, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - 'PR "chore(deps): bump actions/checkout from 3 to 4" by dependabot[bot] — its CI checks have failed. → INTENT: DEPENDABOTCIFIX, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - 'PR AUTHOR: dependabot[bot], PR CHECKS: failing, COMMENT: "@bot can you take a look at this?" → INTENT: DEPENDABOTCIFIX, REPO: NONE, ISSUE: NONE, REASON: NONE'

phases:
  # Diagnose before repairing: classify the failure against the pre-cloned
  # workspace (cheap) BEFORE the install + test cycle (expensive), so a failure
  # no amount of fixing can address costs one short call. See the `fixing` skill.
  - name: diagnose
    label: Diagnose the failing checks
    prompt: prompts/diagnose-ci.md
    skill: fixing
    # Cheap by intent — it reads logs and reproduces a command, it doesn't write
    # code. Unset in config/default.yaml, so this falls through to models.default
    # until an operator pins a cheaper model for it.
    model: "{{models.diagnose}}"
    output_var: diagnosis
    on_output:
      requires_marker: "DIAGNOSIS_COMPLETE"
    messages:
      on_start: "Diagnosing the failing checks on PR #{{prNumber}}..."
      on_failure: "**Couldn't diagnose** the failing checks on PR #{{prNumber}}."

  - name: fix
    label: Fix failing checks
    prompt: prompts/dependabot-ci-fix.md
    # `fixing` is primary (minimal repair + push discipline + the markers);
    # `building`: install deps with the repo's package manager, then run the
    # test/lint/typecheck gate before committing.
    skills: [fixing, building]
    model: "{{models.pr-fix}}"
    # The three stopping classes: there is nothing here for a fix phase to do,
    # so it must not provision a sandbox and run a 900-second gate for one. A
    # non-failing skip — the RUN still records `succeeded`, so `on_failure`
    # below ("leaving it for a human") does NOT post and the PR is never
    # poisoned with `requires-human` for a failure that isn't its fault.
    #
    # `class=flaky` is the one BOUNDED row: after `fix.maxFlakyDeferrals` (2)
    # consecutive `flaky` verdicts on the same problem the harness drops this
    # expression for that run, so the third one is attempted as `reproducible`
    # (09-state-machine.md §S1 — three flaky reports running is an intermittent
    # real failure, and an unbounded series of free full runs otherwise).
    # `promoteFlakyDiagnosis` in src/workflows/simple.ts matches the expression
    # below LITERALLY; the other two rows always apply.
    skip_if:
      - "phaseOutputs.diagnosis.contains('class=flaky')"
      - "phaseOutputs.diagnosis.contains('class=infra-dependent')"
      - "phaseOutputs.diagnosis.contains('class=upstream-broken')"
    # Load-bearing, not cosmetic: `runUntilBash` defaults to
    # `timeout_seconds ?? 30`, and thirty seconds kills any real test suite
    # mid-run and reports a false red. Mirrors `fix.gateTimeoutSeconds` (900) in
    # config/default.yaml — the schema parses this as a plain number, so it
    # can't be templated; keep the two in step by hand.
    timeout_seconds: 900
    # Closes the missing-postcondition gap: without a marker, a run that
    # inspects the PR and stops without pushing or labelling reports green.
    on_output:
      requires_marker: "CI_FIX_COMPLETE"
    # The within-run local gate loop (04-retry.md §4.5). The gate command isn't
    # statically knowable — package manager from the lockfile, commands from the
    # repo's CI workflow — so the `fixing` skill has the agent write it to
    # `.lastlight-verify.sh` at the repo root (excluded from git by the harness,
    # and deleted at the start of every attempt so a superseded diagnosis can't
    # gate this one). No script yet ⇒ an EXPLICIT non-zero exit: `gate=skipped`
    # is treated as red and never authorises a push (09-state-machine.md §S1).
    # `max_iterations` mirrors `fix.localIterations` (2); same templating
    # caveat as `timeout_seconds` above.
    generic_loop:
      max_iterations: 2
      until_bash: "if [ -f .lastlight-verify.sh ]; then sh .lastlight-verify.sh; else echo 'no .lastlight-verify.sh — gate=skipped, treated as RED'; exit 1; fi"
      fresh_context: false
    messages:
      on_start: "On it — investigating the failing checks on PR #{{prNumber}}..."
      on_success: "**Fix pushed** to `{{branch}}`."
      on_failure: "**Couldn't auto-fix** the failing checks on PR #{{prNumber}} — leaving it for a human."
      on_skipped_done: "**No fix attempted** — the diagnosis says this isn't fixable from here. See the verdict above."
