kind: comment
name: pr-comment
git_access: issues-write
description: |
  Answer a maintainer's question about an open PR with concrete, code-cited
  evidence. The PR-side counterpart to `issue-comment`, separate because PR
  questions need the diff and a higher file-read cap.

phases:
  - name: respond
    label: Respond
    skill: pr-comment
    model: "{{models.comment}}"
