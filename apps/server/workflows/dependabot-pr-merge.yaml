kind: pr-merge
name: dependabot-pr-merge
# PR-scoped (09-state-machine.md §S1/§S4): this workflow runs against a pull
# request, so it crosses the PR-scoped dispatch gate — the run lock shared with
# every other PR-scoped workflow, the per-head-SHA dedup, escalation, and the
# resolved `PrState` snapshot on `context.prState`. A fork of this workflow that
# drops the key silently loses all four; `validateAssets` warns when a
# `routes.github.pr_*` target is missing it.
pr_scoped: true
description: |
  Assess an already-GREEN dependency-update PR (Dependabot / Renovate) and, when
  the change is trivial, enable GitHub auto-merge (squash) so it lands once its
  checks pass. When a bump is merely behind the base branch or has a lockfile
  conflict, it asks the bot that opened the PR to rebase/recreate its own branch
  (@dependabot rebase|recreate, or Renovate's rebase label) — it never pushes or
  rebases itself. That branch request is independent of the merge verdict: a
  non-trivial bump (e.g. a major version) still gets its branch regenerated,
  since regenerating is safe and pre-empts no review, but does NOT get
  auto-merge — only trivial bumps do. The companion to dependabot-ci-fix: that
  one repairs a RED bump and pushes a fix; this one merges a GREEN one that
  needs no fix at all.

  Always runs against a SINGLE PR (`{{prNumber}}`). Triggered by:
    - pr.checks_passed webhook (a check_suite completed with a success
      conclusion on a Dependabot/Renovate PR) → routed here by the router's
      deterministic intent lookup (src/engine/router.ts + this file's
      `classification`).
    - the cron-dependabot-merge backstop: the cron runner finds the green
      dependency PRs across managed repos IN CODE
      (src/cron/dependabot-discovery.ts) and fans out one run per PR — same
      single-PR shape as the webhook. (This replaced an agent `mode: scan`
      sweep that assessed a whole repo at once and overflowed on busy repos.)
classification:
  intent: dependabot-pr-merge
  description: |
    DEPENDABOTPRMERGE — a GREEN dependency-update pull request (opened by
    Dependabot or Renovate, e.g. "Bump <pkg> from X to Y", "chore(deps): update
    <pkg>") whose CI checks have PASSED and which may be safe to auto-merge with
    no code change. Choose this ONLY for a passing dependency-bump PR that needs
    no fix; prefer DEPENDABOTCIFIX when a dependency PR's checks have FAILED, and
    REVIEW for a normal (non-dependency) PR. Also choose it when a maintainer's
    comment asks the bot to handle/look at/land such a PR and `PR CHECKS` is
    `passing` (with a `PR AUTHOR` of dependabot[bot]/renovate[bot]) — but keep
    REVIEW when they explicitly ask for a review.
  examples:
    - 'PR "Bump lodash from 4.17.20 to 4.17.21" by dependabot[bot] — its CI checks have passed. → INTENT: DEPENDABOTPRMERGE, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - 'PR "chore(deps): bump actions/checkout from 3 to 4" by renovate[bot] — its CI checks have passed. → INTENT: DEPENDABOTPRMERGE, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - 'PR AUTHOR: renovate[bot], PR CHECKS: passing, COMMENT: "@bot can you look at this?" → INTENT: DEPENDABOTPRMERGE, REPO: NONE, ISSUE: NONE, REASON: NONE'

phases:
  # Single phase. Runs under this workflow's repo-write profile, so agentic-pi's
  # `github_enable_auto_merge` (+ `github_add_issue_comment` / `github_add_labels`
  # for the rebase nudge) tools are available. Conservative by design: enable
  # auto-merge ONLY for trivial, non-functional dependency bumps; anything with
  # runtime-logic impact is left for a human. No repo checkout — the agent
  # inspects the ONE PR via `github_list_pull_request_files` (file list + line
  # counts) and skips lockfile diffs, only pulling `github_get_pull_request_diff`
  # for a small non-lockfile source change. It never pushes or rebases itself: a
  # PR that is `behind`/`dirty` is nudged to rebase via the bot's own command
  # (@dependabot rebase|recreate) or Renovate's rebase label. That nudge is NOT
  # gated on the verdict — regenerating a bot's own branch is safe and says
  # nothing about merge-safety — but only a trivial PR also gets auto-merge
  # enabled to land it once GitHub re-runs the checks green. Because
  # each run assesses a single PR, its context is bounded — the overflow that
  # killed the old whole-repo scan can't happen. See prompts/dependabot-pr-merge.md.
  - name: assess
    label: Assess & maybe auto-merge
    prompt: prompts/dependabot-pr-merge.md
    # `code-review`: the finding-tier / what-to-check rubric for reading a diff.
    # `dependency-impact`: the low/medium/high rubric for a MAJOR bump (#252) —
    # a skill rather than more prompt prose because it is needed ONLY when the
    # PR is a major, and pi surfaces skills as an on-demand catalogue. It is
    # also per-repo overridable (`.lastlight/skills/dependency-impact/SKILL.md`)
    # without the operator having to widen `repoConfig.allowKeys`.
    skills: [code-review, dependency-impact]
    model: "{{models.review}}"
    # Postcondition: the assess run MUST sign off with this marker (see the
    # prompt's OUTPUT contract). Its absence means the agent inspected files then
    # stopped without reaching a verdict or acting — a silent no-op that used to
    # report a false green (e.g. after a context-overflow retry). Fail loudly.
    on_output:
      requires_marker: "ASSESSMENT_COMPLETE"
    # Deliberately NO on_start / on_success acks: they posted a comment on the PR
    # on EVERY run (a green suite fires per check-reporting app, plus the daily
    # cron), which flooded dependency PRs with "Assessing…/Assessed…" noise. The
    # run now comments only when it has something to say — a real verdict
    # (functional / requires-human) or a rebase nudge from the prompt, or the
    # on_failure notice below.
    messages:
      on_failure: "Couldn't assess the dependency PR — leaving for a human."
