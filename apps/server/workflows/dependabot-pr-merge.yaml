kind: pr-merge
name: dependabot-pr-merge
# Crosses the PR-scoped dispatch gate: the run lock, per-head-SHA dedup,
# escalation, and the resolved `PrState` snapshot on `context.prState`. Always
# single-PR, so a repeated webhook and the daily cron backstop dedup onto one
# run.
pr_scoped: true
# Never pushes code, but `github_enable_auto_merge` lives in the repo-write
# tool profile.
git_access: repo-write
workspace: per-target-reuse
description: |
  Assess an already-GREEN dependency-update PR and, when the change is trivial,
  enable GitHub auto-merge (squash). Always runs against a single PR.

  When a bump is merely behind its base or has a lockfile conflict it asks the
  bot that opened the PR to rebase or recreate its own branch; it never pushes
  or rebases itself. That request is independent of the merge verdict — a major
  version still gets its branch regenerated, but only a trivial bump is merged.
  The companion to dependabot-ci-fix, which repairs a RED bump instead.

classification:
  intent: dependabot-pr-merge
  description: |
    DEPENDABOTPRMERGE — a GREEN dependency-update pull request (opened by
    Dependabot or Renovate, e.g. "Bump <pkg> from X to Y", "chore(deps): update
    <pkg>") whose CI checks have PASSED and which may be safe to auto-merge with
    no code change. Choose this ONLY for a passing dependency-bump PR that needs
    no fix; prefer DEPENDABOTCIFIX when a dependency PR's checks have FAILED, and
    REVIEW for a normal (non-dependency) PR. Also choose it when a maintainer's
    comment asks the bot to handle/look at/land such a PR and `PR CHECKS` is
    `passing` (with a `PR AUTHOR` of dependabot[bot]/renovate[bot]) — but keep
    REVIEW when they explicitly ask for a review.
  examples:
    - 'PR "Bump lodash from 4.17.20 to 4.17.21" by dependabot[bot] — its CI checks have passed. → INTENT: DEPENDABOTPRMERGE, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - 'PR "chore(deps): bump actions/checkout from 3 to 4" by renovate[bot] — its CI checks have passed. → INTENT: DEPENDABOTPRMERGE, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - 'PR AUTHOR: renovate[bot], PR CHECKS: passing, COMMENT: "@bot can you look at this?" → INTENT: DEPENDABOTPRMERGE, REPO: NONE, ISSUE: NONE, REASON: NONE'

phases:
  # One phase, and no repo checkout: the agent reads the PR's file list, skips
  # lockfile diffs, and pulls the diff only for a small non-lockfile source
  # change — so its context is bounded by construction.
  #
  # It is also the last gate before a merge, and therefore the backstop against
  # a fix that made CI green by DISABLING the check: suppression turns the
  # checks green, so `pr.checks_failed` never fires again and the fix family
  # never sees the PR. "Nothing weakens verification" is a trivial-disqualifying
  # conjunct in the prompt; nothing enforces it in code.
  - name: assess
    label: Assess & maybe auto-merge
    prompt: prompts/dependabot-pr-merge.md
    # `dependency-impact` is a skill rather than more prompt prose because it is
    # needed only for a MAJOR bump, and skills are surfaced on demand.
    skills: [code-review, dependency-impact]
    model: "{{models.review}}"
    on_output:
      requires_marker: "ASSESSMENT_COMPLETE"
    messages:
      on_failure: "Couldn't assess the dependency PR — leaving for a human."
