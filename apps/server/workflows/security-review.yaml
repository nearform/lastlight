kind: health
name: security-review
git_access: issues-write
classification:
  intent: security
  description: |
    SECURITY — The user wants a security scan/review of a repo: "security review cliftonc/repo", "scan for vulnerabilities", "check security", "can you do a security review of <repo>?".
  examples:
    - '"run a security review on cliftonc/lastlight" → INTENT: SECURITY, REPO: cliftonc/lastlight, ISSUE: NONE, REASON: NONE'
    - '"can you do a security review of https://github.com/cliftonc/lastlight" → INTENT: SECURITY, REPO: cliftonc/lastlight, ISSUE: NONE, REASON: NONE'
    - '"scan https://github.com/cliftonc/lastlight for vulnerabilities" → INTENT: SECURITY, REPO: cliftonc/lastlight, ISSUE: NONE, REASON: NONE'
chat:
  trigger: security review owner/repo
  summary: Security-scan a repo
  deflect:
    - security review
    - scan for vulnerabilities
    - check security of <repo>
description: |
  Scan the repository for security issues with open-source tools (npm audit,
  semgrep, gitleaks) plus AI review, and file ONE summary issue per run: a task
  list of every finding grouped by Critical / High / Medium / Low. Honours
  SECURITY.md for known false positives and accepted risks.

phases:
  - name: scan
    label: Security scan
    skill: security-review
    model: "{{models.security}}"
    variant: "{{variants.security}}"
