kind: health
name: security-feedback
git_access: repo-write
description: |
  Process maintainer feedback on a security-labelled issue, usually a scan
  summary. Classifies the comment and acts: break selected findings out into
  their own issues (the primary flow), update SECURITY.md via PR to suppress a
  finding as accepted-risk or a false positive, ask for a re-run, or simply
  reply.

  The scan-summary grammar it parses is defined in
  `skills/security-review/SKILL.md § Issue format` and version-checked on entry.

phases:
  - name: feedback
    label: Security feedback
    skill: security-feedback
    model: "{{models.security}}"
