kind: demo
name: demo
git_access: issues-write
prepopulate_synth_branch: true
prepopulate_pr_head_ref: true
classification:
  intent: demo
  description: |
    DEMO — The user wants you to record a DEMO VIDEO of a feature/PR: "demo this", "record a demo of the new dashboard", "make a video showing the dark-mode toggle", "show me a before/after of the fix". The deliverable is a short screen-recorded mp4 of the running web UI, not a pass/fail report and not a verdict. Prefer DEMO over QATEST/VERIFY when the user explicitly asks for a recording, a video, or "show"/"demo" rather than to test or confirm a behaviour.
  examples:
    - '"record a demo of this" with ISSUE TITLE "Add dark-mode toggle" → INTENT: DEMO, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - '"make a short before/after video of the fix on cliftonc/foo#12" → INTENT: DEMO, REPO: cliftonc/foo, ISSUE: 12, REASON: NONE'
chat:
  trigger: "demo owner/repo#N -- <what to show>"
  summary: Record a short demo video of a feature or PR
  deflect:
    - demo this
    - record a demo of <feature>
    - make a video showing <X>
    - show me a before/after of the fix
description: |
  Record a short demo VIDEO of a PR or feature and post it. Drives the repo's
  web UI in a real headless browser, screen-records the session, and composites
  a titled, size-capped mp4 with ffmpeg. Never modifies code.

  The demo phase needs the docker backend and the browser-QA image; anywhere
  else it is SKIPPED and the run completes without a video rather than failing.
  Delivery is one in-place status comment whose footer becomes the report.

status_checklist: true
final_message: "{{demoResult}}"

phases:
  - name: phase_0
    label: Context
    type: context
    depends_on: []

  - name: demo
    label: Demo
    depends_on: [phase_0]
    prompt: prompts/demo.md
    skills: [demo, browser-qa, building]
    model: "{{models.demo}}"
    variant: "{{variants.demo}}"
    requires_sandbox: docker
    sandbox_image: qa
    output_var: demoResult
    messages:
      on_start: "Recording a demo — installing, running the app, and capturing the UI..."
      on_success: "Demo recorded — see the video below."
      on_failure: "I couldn't record the demo — see the logs for details."
      on_skipped_done: "Demo unavailable on this host (needs the docker browser-QA image)."
