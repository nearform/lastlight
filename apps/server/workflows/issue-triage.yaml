kind: triage
name: issue-triage
classification:
  intent: triage
  description: |
    TRIAGE — The user wants to scan/triage issues on a repo: "triage cliftonc/repo", "scan for new issues", "can you triage <repo>?".
  examples:
    - '"could you triage https://github.com/foo/bar?" → INTENT: TRIAGE, REPO: foo/bar, ISSUE: NONE, REASON: NONE'
description: |
  Triage a GitHub issue: read it, classify it, label it, and act on stale or
  incomplete reports. Single agent invocation, no PR creation.

  Triggered by:
    - issue.opened webhook
    - cron scan over managed repos
    - manual CLI: tsx src/cli.ts cliftonc/owner/repo#N

phases:
  - name: triage
    label: Triage
    skill: issue-triage
    model: "{{models.triage}}"
    # Postcondition: the triage skill must end with the TRIAGE_COMPLETE marker,
    # emitted only after the work is actually done (see skills/issue-triage).
    # An agent that bails — no github_* tools, repo inaccessible, "re-invoke me" —
    # never prints it, so the phase fails instead of greening a silent no-op.
    on_output:
      requires_marker: "TRIAGE_COMPLETE"
