kind: qa-test
name: qa-test
git_access: issues-write
prepopulate_synth_branch: true
prepopulate_pr_head_ref: true
classification:
  intent: qa-test
  description: |
    QATEST — The user wants you to drive an app or CLI through a flow and report step-level pass/fail: "qa test the signup flow", "run through login and tell me what breaks", "smoke-test the CLI commands", "exercise the checkout flow". The deliverable is a step-by-step QA report. Prefer QATEST over VERIFY when it's a multi-step flow to exercise rather than a single claim to confirm.
  examples:
    - '"qa test the login flow on this PR" with ISSUE TITLE "Add login" → INTENT: QATEST, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - '"run through the signup flow and tell me what breaks" with ISSUE TITLE "Signup v2" → INTENT: QATEST, REPO: NONE, ISSUE: NONE, REASON: NONE'
chat:
  trigger: "qa-test owner/repo#N -- <steps>"
  summary: Drive an app or CLI through a flow and report step-level pass/fail
  deflect:
    - qa test the <flow> flow
    - run through <flow> and tell me what breaks
    - smoke-test the CLI commands
description: |
  Run an automated QA flow against a repo's CLI or locally-served app and
  report step-level pass/fail with evidence. Installs and runs the code in the
  sandbox, exercises the flow, and posts one QA report. Never modifies code.

  A final `synthesize` phase folds the text report and, when it ran, the
  browser evidence into ONE report delivered as the status comment's footer —
  no comment per phase, and the agents post nothing themselves. The browser
  phase needs the docker backend and the browser-QA image; anywhere else it is
  skipped and the text report stands alone.

status_checklist: true
final_message: "{{synthesisResult}}"

phases:
  - name: phase_0
    label: Context
    type: context
    depends_on: []

  - name: qa_test
    label: QA Test
    depends_on: [phase_0]
    prompt: prompts/qa-test.md
    skills: [qa-test, building]
    model: "{{models.qa-test}}"
    variant: "{{variants.qa-test}}"
    output_var: qaResult
    messages:
      on_start: "Running the QA flow — installing, running, and exercising each step..."
      on_success: "Text QA flow complete."
      on_failure: "I couldn't complete the QA run — see the logs for details."

  - name: qa_browser
    label: QA Test (browser)
    depends_on: [qa_test]
    prompt: prompts/qa-browser.md
    skills: [qa-test, building, browser-qa]
    model: "{{models.qa-test}}"
    variant: "{{variants.qa-test}}"
    requires_sandbox: docker
    sandbox_image: qa
    output_var: qaBrowserResult
    messages:
      on_start: "Browser QA available — driving the UI and capturing screenshots..."
      on_success: "Browser QA complete — screenshots captured."
      on_skipped_done: "Browser QA unavailable on this host — text report stands."

  - name: synthesize
    label: Summary
    depends_on: [qa_test, qa_browser]
    prompt: prompts/qa-synth.md
    model: "{{models.qa-test}}"
    variant: "{{variants.qa-test}}"
    output_var: synthesisResult
    messages:
      on_start: "Synthesizing the final report..."
      on_success: "Report posted below."
      on_failure: "I couldn't synthesize the final report — see the logs."
