kind: cron
name: merge-green-dependency-prs
schedule: "0 14 * * *"
workflow: dependabot-pr-merge
context:
  # Finds the green dependency PRs across managed repos in code and fans out
  # one single-PR run each — the same shape the `pr.checks_passed` webhook
  # produces, rather than one agent sweeping a whole repo.
  discover: green-dependency-prs
