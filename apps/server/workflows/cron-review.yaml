kind: cron
name: check-prs-awaiting-review
schedule: "*/30 * * * *"
workflow: pr-review
context:
  # The cron runner finds the open PRs needing review IN CODE and fans out one
  # bounded single-PR `pr-review` run each — prNumber + head ref set, the same
  # shape the `pr.opened` webhook produces.
  discover: prs-awaiting-review

# Deliberately NO `condition:` — this sweep runs even with webhooks enabled. It
# is the release mechanism for every PR whose fix chain ended without pushing
# (no new commit means no further `check_suite` will ever fire), the re-pickup
# that makes the PR-scoped run lock safe to drop a conflicting run rather than
# queue it, and what supersedes a `queued` review check left by a settle event
# that was never delivered.
