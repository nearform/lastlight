kind: pr-fix
name: pr-fix
description: "Lightweight PR fix — no architect/reviewer, just fix and push"
trigger: pr-fix
# Single in-place task-list comment/message instead of a comment per phase.
status_checklist: true

phases:
  # Diagnose before repairing: classify the failure against the pre-cloned
  # workspace (cheap) BEFORE the install + test cycle (expensive), so a failure
  # no amount of fixing can address costs one short call. See the `fixing` skill.
  - name: diagnose
    label: Diagnose the failure
    prompt: prompts/diagnose-ci.md
    skill: fixing
    # Cheap by intent — it reads logs and reproduces a command, it doesn't write
    # code. Unset in config/default.yaml, so this falls through to models.default
    # until an operator pins a cheaper model for it.
    model: "{{models.diagnose}}"
    output_var: diagnosis
    on_output:
      requires_marker: "DIAGNOSIS_COMPLETE"
    messages:
      on_start: "Diagnosing the failure on PR #{{prNumber}}..."
      on_failure: "**Couldn't diagnose** the failure on PR #{{prNumber}}."

  - name: fix
    label: Fix
    prompt: prompts/pr-fix.md
    # `fixing` is primary (minimal repair + push discipline + the markers);
    # `building` stays available for the install / gate mechanics.
    skills: [fixing, building]
    model: "{{models.pr-fix}}"
    # The three stopping classes: there is nothing here for a fix phase to do,
    # so it must not provision a sandbox and run a 900-second gate for one. A
    # non-failing skip — the RUN still records `succeeded`, because correctly
    # determining the PR can't be fixed here IS the job. One expression per
    # class, so the list reads as the class list it is.
    #
    # `class=flaky` is the one BOUNDED row: after `fix.maxFlakyDeferrals` (2)
    # consecutive `flaky` verdicts on the same problem the harness drops this
    # expression for that run, so the third one is attempted as `reproducible`
    # (09-state-machine.md §S1 — three flaky reports running is an intermittent
    # real failure, and an unbounded series of free full runs otherwise).
    # `promoteFlakyDiagnosis` in src/workflows/simple.ts matches the expression
    # below LITERALLY; the other two rows always apply.
    skip_if:
      - "phaseOutputs.diagnosis.contains('class=flaky')"
      - "phaseOutputs.diagnosis.contains('class=infra-dependent')"
      - "phaseOutputs.diagnosis.contains('class=upstream-broken')"
    # Load-bearing, not cosmetic: `runUntilBash` defaults to
    # `timeout_seconds ?? 30`, and thirty seconds kills any real test suite
    # mid-run and reports a false red. Mirrors `fix.gateTimeoutSeconds` (900) in
    # config/default.yaml — the schema parses this as a plain number, so it
    # can't be templated; keep the two in step by hand.
    timeout_seconds: 900
    on_output:
      requires_marker: "CI_FIX_COMPLETE"
    # The within-run local gate loop (04-retry.md §4.5). The gate command isn't
    # statically knowable — package manager from the lockfile, commands from the
    # repo's CI workflow — so the `fixing` skill has the agent write it to
    # `.lastlight-verify.sh` at the repo root (excluded from git by the harness,
    # and deleted at the start of every attempt so a superseded diagnosis can't
    # gate this one). No script yet ⇒ an EXPLICIT non-zero exit: `gate=skipped`
    # is treated as red and never authorises a push (09-state-machine.md §S1).
    # `max_iterations` mirrors `fix.localIterations` (2); same templating
    # caveat as `timeout_seconds` above.
    generic_loop:
      max_iterations: 2
      until_bash: "if [ -f .lastlight-verify.sh ]; then sh .lastlight-verify.sh; else echo 'no .lastlight-verify.sh — gate=skipped, treated as RED'; exit 1; fi"
      fresh_context: false
    messages:
      on_start: "On it — fixing PR #{{prNumber}}..."
      on_success: "**Fix pushed** to `{{branch}}`. CI should re-run automatically."
      on_failure: "**Fix failed** — I wasn't able to resolve this automatically."
      on_skipped_done: "**No fix attempted** — the diagnosis says this isn't fixable from here. See the verdict above."
