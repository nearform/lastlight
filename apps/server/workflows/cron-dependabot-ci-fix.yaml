kind: cron
name: fix-red-dependency-prs
schedule: "0 15 * * *"
workflow: dependabot-ci-fix
context:
  # Fans out one run per PR whose checks are settled-failing, or whose
  # `mergeable_state` is `behind` / `dirty` / `blocked`. The nightly backstop
  # for the `pr.checks_failed` webhook.
  discover: red-dependency-prs
