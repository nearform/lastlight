kind: answer
name: answer
# Runtime policy (issue #368) — read + post the answer as a comment; never
# pushes code. Full prose for each key is in the workflow schema
# (packages/workflow-engine/src/core/schema.ts).
git_access: issues-write
classification:
  intent: question
  description: |
    QUESTION — A substantive informational question whose answer needs research the CHAT path cannot do. The deliverable is an ANSWER, not code and not a spec. Exactly two things qualify it:
      (a) THE WEB — comparisons against other tools or products, upstream/third-party documentation, current external facts, anything outside the repo.
      (b) REAL EXPLORATION OF A CHECKOUT — tracing a behaviour across many files, following call paths, reading build/test/config output, "why does X actually happen?" where finding out means grepping around the tree rather than opening a file or two.
    Chat already reads GitHub directly: repo metadata, issues and their comments, pull requests AND their diffs, file contents, commit history, and both code and issue search. A question answerable from those reads is CHAT — even when it names a repo, and even when it is a serious technical question. Naming a repo is not evidence a question is heavy; needing the web or a checkout is.
    This downgrade applies to CHAT/SLACK MESSAGES ONLY, where a chat path exists to catch it. A newly-opened GitHub ISSUE that asks a question is always QUESTION: an issue has no chat surface, and the alternative is silently triaging a question as a work item.
    EXPLORE shapes a NEW idea into a spec; QUESTION answers an EXISTING question that needs research beyond a few file reads.
  examples:
    # (a) the web — no amount of repo reading answers this.
    - '"how does cliftonc/lastlight compare to Vercel''s Eve framework?" → INTENT: QUESTION, REPO: cliftonc/lastlight, ISSUE: NONE, REASON: NONE'
    # (b) a checkout — "actually" / "trace it" is asking for the code path, not a file.
    - '"why does the dependency cron sometimes skip a PR in cliftonc/lastlight? trace it through the code" → INTENT: QUESTION, REPO: cliftonc/lastlight, ISSUE: NONE, REASON: NONE'
    # Counter-examples: serious, repo-scoped, and answerable from chat''s own
    # GitHub reads. These are the ones that used to burn a sandbox.
    - '"what does the pr-review workflow do in cliftonc/lastlight?" → INTENT: CHAT, REPO: cliftonc/lastlight, ISSUE: NONE, REASON: NONE'
    - '"what changed in cliftonc/lastlight#273?" → INTENT: CHAT, REPO: cliftonc/lastlight, ISSUE: 273, REASON: NONE'
    - '"why was cliftonc/lastlight#40 closed?" → INTENT: CHAT, REPO: cliftonc/lastlight, ISSUE: 40, REASON: NONE'
    # The GitHub carve-out, deliberately near-identical to the CHAT
    # counter-example above: on an ISSUE there is no chat to downgrade TO, and
    # the alternative is triaging a question as a work item.
    - '"what does the pr-review workflow actually do?" with ISSUE TITLE "Question: what does pr-review do?" → INTENT: QUESTION, REPO: NONE, ISSUE: NONE, REASON: NONE'
chat:
  summary: Research a question that needs the web or a deep read of a checkout
  deflect:
    - how does <repo> compare to <other tool>?
    - what do the upstream docs say about <X>?
    - a research-heavy question that needs web search or deep doc reading
  reply: >-
    this runs as a sandboxed answer workflow, but only when you name a managed
    repo. If the user asked such a question without a repo, ask them to include it
    (e.g. "how does cliftonc/lastlight compare to X?") and the answer will be
    researched and posted back here. Don't attempt the deep research yourself
    in-process.
description: |
  Answer a question issue directly. Used when a newly-opened issue asks for
  information, an explanation, or a comparison rather than a code change — the
  bot researches (repo docs + web search) and posts a single sourced answer
  comment, labels the issue `question`, and leaves it open. No agent brief, no
  ready-for-agent, no PR.

  Delivery is uniform: the agent's final message (the answer) is captured as
  `answerResult` and posted by the harness via `postComment` — as a comment on
  the originating issue for GitHub-initiated runs, or into the Slack thread for
  Slack-initiated runs. The skill therefore does NOT post the answer itself; it
  only applies the `question` label when answering a GitHub issue.

  Triggered by:
    - issue.opened webhook when the router classifies the issue as a question
    - a Slack message classified as a question against a managed repo — only
      one chat cannot answer itself; see the `classification:` block above.
      Chat reads GitHub directly (issues, PR diffs, file contents, code
      search), so this workflow's edge is the WEB (`web_search: true`) and a
      real checkout to explore. A question needing neither is CHAT, which
      answers in-process in seconds instead of provisioning a sandbox.
    - manual override via routes.github.issue_answer / routes.slack.answer

phases:
  - name: phase_0
    label: Context
    type: context

  - name: answer
    label: Answer
    prompt: prompts/answer.md
    skill: issue-answer
    model: "{{models.answer}}"
    web_search: true
    unrestricted_egress: true
    output_var: answerResult
    messages:
      on_start: "Researching and drafting an answer..."
      on_success: "{{answerResult}}"
      on_failure: "I couldn't put together an answer — see the logs for details."
