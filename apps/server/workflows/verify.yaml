kind: verify
name: verify
git_access: issues-write
prepopulate_synth_branch: true
prepopulate_pr_head_ref: true
classification:
  intent: verify
  description: |
    VERIFY — The user wants you to TEST whether a specific claim or behaviour is actually true and report the evidence: "verify that the rate limiter blocks", "does this PR really fix the crash?", "confirm X actually works", "check that Y no longer happens", "prove the --fork flag creates a new session". The deliverable is a CONFIRMED/REFUTED verdict backed by RUNNING the code — not a code change and not a code-quality review. Prefer VERIFY over REVIEW when the user wants proof a behaviour works/is fixed, rather than an assessment of the diff.
  examples:
    - '"verify that the --fork flag creates a new session in cliftonc/foo#12" → INTENT: VERIFY, REPO: cliftonc/foo, ISSUE: 12, REASON: NONE'
    - '"does this actually fix the crash?" with ISSUE TITLE "Fix null deref on resize" → INTENT: VERIFY, REPO: NONE, ISSUE: NONE, REASON: NONE'
    - '"can you confirm the rate limiter actually blocks at 100 req/s?" with ISSUE TITLE "Add rate limiter" → INTENT: VERIFY, REPO: NONE, ISSUE: NONE, REASON: NONE'
chat:
  trigger: "verify owner/repo#N -- <claim>"
  summary: Test whether a specific claim or behaviour actually holds, with evidence
  deflect:
    - verify that <X> works
    - does this PR really fix <Y>?
    - confirm <Z> actually happens
description: |
  Verify a behaviour claim against a repo or PR and report whether the evidence
  confirms or refutes it. Installs and runs the code in the sandbox, captures
  evidence, and posts one CONFIRMED / REFUTED / INCONCLUSIVE verdict. Never
  modifies code.

  A final `synthesize` phase folds the text verdict and, when it ran, the
  browser evidence into ONE verdict delivered as the status comment's footer —
  no comment per phase, and the agents post nothing themselves. The browser
  phase needs the docker backend and the browser-QA image; anywhere else it is
  skipped and the text verdict stands alone.

status_checklist: true
final_message: "{{synthesisResult}}"

phases:
  - name: phase_0
    label: Context
    type: context
    depends_on: []

  - name: verify
    label: Verify
    depends_on: [phase_0]
    prompt: prompts/verify.md
    skills: [verify, building]
    model: "{{models.verify}}"
    variant: "{{variants.verify}}"
    output_var: verifyResult
    messages:
      on_start: "Verifying the claim — installing, running, and capturing evidence..."
      on_success: "Text verification complete."
      on_failure: "I couldn't complete the verification — see the logs for details."

  - name: verify_browser
    label: Verify (browser)
    depends_on: [verify]
    prompt: prompts/verify-browser.md
    skills: [verify, building, browser-qa]
    model: "{{models.verify}}"
    variant: "{{variants.verify}}"
    requires_sandbox: docker
    sandbox_image: qa
    output_var: verifyBrowserResult
    messages:
      on_start: "Browser QA available — driving the UI and capturing screenshots..."
      on_success: "Browser QA complete — screenshots captured."
      on_skipped_done: "Browser QA unavailable on this host — text verdict stands."

  - name: synthesize
    label: Summary
    depends_on: [verify, verify_browser]
    prompt: prompts/verify-synth.md
    model: "{{models.verify}}"
    variant: "{{variants.verify}}"
    output_var: synthesisResult
    messages:
      on_start: "Synthesizing the final verdict..."
      on_success: "Verdict posted below."
      on_failure: "I couldn't synthesize the final verdict — see the logs."
