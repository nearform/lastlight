apiVersion: v1
kind: Namespace
metadata:
  name: lastlight-sandboxes
  labels:
    # The kubernetes sandbox backend's pod spec is restricted-PSA compliant by
    # construction: runAsNonRoot, seccompProfile RuntimeDefault,
    # allowPrivilegeEscalation false, all capabilities dropped
    # (KubernetesSandbox, apps/server/src/sandbox/k8s/kubernetes-sandbox.ts).
    # No privileged component runs in this namespace.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
