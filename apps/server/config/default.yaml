# Repositories Last Light manages. Set an explicit list in your private overlay
# ($LASTLIGHT_OVERLAY_DIR/config.yaml), which replaces this one wholesale;
# webhooks for repos not listed are filtered at the connector level. When left
# EMPTY (the default), the managed list is instead sourced from the GitHub App
# installation itself — the repos it can access, discovered at boot and kept
# live by installation webhooks — so an org install that already limits the App
# to a subset of repos need not maintain a second copy here. See
# src/managed-repos.ts.
managedRepos: []

# The GitHub App slug (no `[bot]` suffix). Single source of truth for the bot's
# identity: the incoming `@mention` handle (e.g. `@last-light`), the derived
# `botLogin` (`<botName>[bot]`, self-comment/self-review filter), and the git
# commit author. Override in your overlay `config.yaml` or via the
# `GITHUB_APP_BOT_NAME` env var — e.g. set `nearform-lastlight` for the
# Nearform app so it triggers on `@nearform-lastlight`.
botName: last-light

models:
  default: anthropic/claude-sonnet-4-6
  # Per-task overrides keyed by phase or helper name, e.g.:
  #   architect: anthropic/claude-opus-4-8
  #   classifier: anthropic/claude-haiku-4-5-20251001   # the intent-routing helper
  #   screener: anthropic/claude-haiku-4-5-20251001     # the prompt-injection screener
  #   diagnose: anthropic/claude-haiku-4-5-20251001     # the CI-failure classifier
  #   pr-fix-retry: anthropic/claude-opus-4-8           # used above fix.escalateModelAfterAttempt
  #   review-survey: anthropic/claude-haiku-4-5-20251001  # the six survey passes
  # A per-task entry wins over `default`. `classifier`/`screener` are the cheap
  # one-shot helpers (src/engine/llm.ts); when unset they fall back to the first
  # configured provider's fast model, NOT `default`.
  #
  # `diagnose` is worth pinning. It is the first phase of both fix workflows and
  # it only reads logs and reproduces a command — it writes no code — so a cheap
  # model is the point of splitting it out from `fix` at all. Left UNSET here
  # because these examples name Anthropic models and a deployment that overrides
  # only `default` to another provider would otherwise find this phase reaching
  # for a provider it has no key for. Unset, it falls through to `default`, so
  # each fix run costs one extra call at the default model until you pin it.
  #
  # `review-survey` is the key the six survey phases of `pr-review.yaml` declare
  # (`model: "{{models.review-survey}}"`, one per obligation family). Pinning it
  # to Haiku 4.5 is NOT a cost downgrade, and that is the unusual part: on review
  # RECALL, Haiku 4.5 BEATS Sonnet 4.6 on two independent evals — 41.2% vs 22.1%
  # on the Martian corpus. It is the better model for this phase, and its price
  # is merely what makes a six-way fan-out affordable inside the pipeline's 2–3x
  # budget. Left UNSET for exactly the `diagnose` reason above: these examples
  # name Anthropic models, and a deployment that overrode only `default` to
  # another provider would find six phases reaching for a provider it has no key
  # for. Unset, all six fall through to `default` — correct, and dearer.

variants: {}

otel:
  enabled: false
  serviceName: lastlight
  includeContent: false
  forwardToSandbox: true
  strict: false
  collectorHosts: []

sandbox:
  backend: gondolin
  maxTurns: 200

# Where the per-phase build handoff docs (architect-plan.md, status.md,
# executor-summary.md, reviewer-verdict.md, …) live:
#   repo   — committed into the target repo under .lastlight/issue-N/ (default,
#            the docs ride the working branch and link to GitHub blob URLs).
#   server — persisted on the Last Light server under $STATE_DIR/build-assets/,
#            injected into each phase from outside the repo (never committed)
#            and linked to the admin dashboard.
buildAssets:
  location: repo

# State database. `url` is either a libsql-style URL
# ("file:/app/data/lastlight.db", ":memory:") or a "postgres://…" URL for an
# external/managed Postgres. null/absent → `file:` + the DB_PATH /
# $STATE_DIR/lastlight.db resolution, i.e. exactly the pre-Drizzle behaviour,
# and the recommended default: SQLite needs nothing running.
#
# ⚠ PUT A postgres:// URL IN `DATABASE_URL` (secrets/.env), NOT HERE. This file
# and your overlay's config.yaml are VERSION-CONTROLLED and pushed to a GitHub
# remote; the dashboard masks the credential at render time, which cannot
# un-commit anything.
#
# `driver` picks how the postgres:// dialect is carried: "pg" (node-postgres, a
# standard TCP pool — self-hosted, RDS, Cloud SQL, Supabase) or "neon" (Neon's
# serverless WebSocket pool). Absent → auto-detected from the host, so only a
# Neon database behind a custom domain needs it. `poolMax` bounds the pool
# (default 10). Last Light is a single-writer process — Postgres here is a
# storage choice, not multi-instance HA.
#
# Env overrides: DATABASE_URL, DATABASE_DRIVER, DATABASE_POOL_MAX.
database:
  url: null
  driver: null
  poolMax: null

# Global concurrency limiter (issue #172). Caps how many sandboxed workflow
# runs execute at once; excess triggers are persisted as `queued` in
# workflow_runs and admitted when a slot frees. Resumes/orphan restarts bypass
# the cap (finish in-flight work first). Queued runs older than
# maxQueueWaitMs are cancelled with a "waited too long" notice.
concurrency:
  maxWorkflows: 4          # env override: MAX_CONCURRENT_WORKFLOWS
  maxQueueWaitMs: 3600000  # 1 hr; env override: MAX_QUEUE_WAIT_MS

# Sandbox-workspace reaping (issue #106). Every task clones the target repo into
# $STATE_DIR/sandboxes/<taskId>/; the harness now owns cleanup of those clones so
# the disk stays bounded under cron-review churn (this replaces the out-of-band
# host cron). `reapOnCompletion` deletes an ephemeral run's workspace the moment
# it finishes successfully; reusable per-PR workspaces (pr-review/pr-fix/build)
# are kept as a warm cache and bounded only by the sweep below. The sweep is the
# backstop for failed/crashed leftovers: it removes non-live dirs older than
# retentionHours and, if more than maxDirs remain, evicts the oldest (LRU). A dir
# whose sandbox container is still running is never removed.
# Feedback signals (issue #255) — a 👍/👎 on something Last Light wrote, scored
# against the workflow run that wrote it, so the effect of prompt/skill changes
# is measurable over time.
#
# Slack is LIVE (reaction_added is a real event) and on by default. GitHub sends
# no webhook for reactions at all, so it has to be polled — that half is opt-in.
# The cost is bounded by the data, not the schedule: we poll individual bot
# comments ("anchors"), never issues, each retires after windowDays, and
# maxAnchorsPerTick/100 is exactly how many GraphQL requests a tick can make
# (one rate-limit point each, against a 5000/hour budget).
feedback:
  enabled: true              # master switch (Slack signals, live)
  github: false              # opt into the GitHub reaction poller
  pollSchedule: "*/30 * * * *"
  windowDays: 14             # how long an anchor stays pollable
  maxAnchorsPerTick: 500     # = 5 GraphQL requests per tick
  retentionDays: 90          # anchors pruned after this; signals kept
  otel: true                 # export each signal as a span on the run's trace

# The optional "my teams' repos" dashboard filter (issue #169).
#
# Offers each GitHub-authenticated user a header toggle that narrows every list
# to the managed repos their GitHub org teams own. **Opt-in and off by default**
# — nobody's view changes until they choose it, and the choice is remembered per
# browser.
#
# Opt-in is load-bearing, not timidity. Team grants describe INVOLVEMENT, not
# access: an org owner reaches every repo without a team grant anywhere. Applied
# as a default this hides people's own work — measured against the live nearform
# install, one maintainer's single team covered 4 of 8 managed repos and hid
# `nearform/lastlight`, which they own. Applied as a filter somebody switched on,
# the same narrowing is exactly the decluttering they asked for.
#
# The filter is your teams' repos PLUS the managed repos your own account owns.
# Teams are an org concept, so a personal repo can never be granted by one; a
# strictly team-derived answer hid every personal repo an instance managed. The
# test is `owner == your login` — not "the owner isn't an org", which would put
# other people's personal repos in your filter.
#
# This flag is the OPERATOR switch: it needs the GitHub App's organization
# `Members: read` permission, so turn it on once you've granted that and
# re-consented the App on each installation. Without it the resolver fails open
# and nothing is filtered — the toggle still appears and says why, so an
# outstanding setup step is visible instead of silent. UI only — every list
# endpoint still returns global data, and each budget below fails OPEN (shows
# more).
#
# Nothing is crawled up front. A user's teams are resolved on demand, on their
# first dashboard request, and cached — so an org with thousands of repos and
# hundreds of teams costs a handful of GraphQL requests per logged-in person,
# not a full-org walk.
teamVisibility:
  enabled: false             # operator switch — needs the App's `Members: read`
  ttlMinutes: 60             # how long a resolved answer is reused
  maxTeamsPerUser: 50        # more teams than this ⇒ fail open
  maxPagesPerTeam: 20        # 100 repos/page; a bigger grant ⇒ fail open
  maxRequestsPerResolve: 60  # absolute ceiling for one cache miss

cleanup:
  sandbox:
    enabled: true              # master switch for the TTL/LRU sweep
    reapOnCompletion: true     # reap ephemeral workspaces on terminal success
    sweepSchedule: "0 * * * *" # hourly
    retentionHours: 12         # sweep dirs older than this
    maxDirs: 40                # LRU cap on total workspace dirs

# Pin which core version an instance runs. Set `deploy.version` to a git tag/ref
# (e.g. v0.10.6) in your private overlay's config.yaml — `lastlight server
# update|setup` then checks core out at that tag and rebuilds, instead of
# tracking `main`. Unset here (and the sentinels `main`/`latest`) means track
# `main` — today's behaviour. Overridable via the `LASTLIGHT_CORE_VERSION` env
# var for CI. Bump + commit in the overlay to drive deploys declaratively.
deploy:
  version: null

approval: {}

# Per-repository configuration (issue #180). A managed repo may commit a
# `.lastlight/` directory — mirroring the instance overlay's on-disk shape
# (`lastlight.yml`, `workflows/prompts/*.md`, `skills/<name>/SKILL.md`,
# `agent-context/*.md`) — that overrides a BOUNDED subset of this config for
# runs against that repo. Precedence: default -> overlay -> env -> repo.
#
# The block below is the OPERATOR's bounds on that layer; a repo can never widen
# them. It is inert out of the box: nothing changes for an existing deployment
# until a repo actually commits `.lastlight/lastlight.yml`.
#
# SECURITY: the repo layer is ALWAYS read from the repo's DEFAULT BRANCH, never
# a PR head and never the sandbox checkout — otherwise a PR could rewrite the
# configuration of the agent reviewing it. See src/config/repo-config.ts.
repoConfig:
  enabled: true                  # master switch; false ignores every repo's .lastlight/
  # Config keys a repo may set, as dotted paths. Anything outside this list is
  # dropped with a warning (the run still proceeds — a repo's config file can
  # never fail a run). Narrow it to tighten the blast radius. Removing `crons`
  # makes the operator's `crons:` block below un-overridable — the kill switch.
  # `fix` / `dependencies` / `review` are clamped one-way (see those blocks): a
  # repo can only ever be MORE conservative than the values set here.
  # `notifications` is the exception to that rule — it is ROUTING (which Slack
  # channel this repo's digest goes to), and a channel has no more/less
  # conservative direction, so the repo's value simply wins. What bounds it is
  # the default-branch trust rule above plus Slack itself: the bot can only post
  # where it has been invited. Drop `notifications` from this list to take
  # channel choice back.
  # `services` is a third shape again: a CAPABILITY GRANT. A repo declaring a test
  # postgres is not asking to be looser than an operator value, it is making a request
  # measured against `allowedImages` below. Drop it from this list to refuse the whole
  # feature outright.
  allowKeys: [models, variants, crons, disabled.workflows, disabled.crons, approval,
              fix, dependencies, review, notifications, services]
  allowedModels: null            # null = any model whose provider prefix is configured;
                                 # a list restricts repos to exactly those model specs
  allowAssets: true              # allow the repo's prompt/skill/agent-context overrides
  # Container images a repo may run as dependency services, registry-qualified.
  # NOTE the polarity is the INVERSE of allowedModels: [] / null denies EVERY image.
  # A service image is arbitrary code pulled onto this host, outside the sandbox's
  # egress policy, so the feature stays inert until you list images here. Example:
  #   allowedImages: ["docker.io/library/postgres:*", "mcr.microsoft.com/mssql/server:*"]
  allowedImages: []
  maxServices: 2                 # ceiling on dependency services per phase

bootstrap:
  label: "lastlight:bootstrap"

# The HOLD label. Apply it to ANY issue or pull request and Last Light stops
# acting on that subject entirely — no triage, no review, no fix, no merge, no
# comment. Remove it and the bot resumes; there is no record to clear either way.
#
# It outranks everything except "we could not read the pull request at all",
# including an explicit `@<bot> ...` request — which gets exactly one reply
# naming the label, so a direct instruction is refused rather than ignored.
# `requires-human` is a NOTIFICATION ("I stopped, a human should look") and is
# read by nothing; this is the live precondition.
#
# Renaming it here changes what the CODE gates on. The packaged prompts create
# the DEFAULT name in their `github_ensure_labels` pass, so a rename also wants
# a forked prompt (or the label created by hand). Env: LASTLIGHT_HOLD_LABEL.
hold:
  label: lastlight-ignore

explore:
  defaultRepo: null

review:
  postsCheck: false            # post the `last-light/review` Check Run
  # When a pr-review run is triggered:
  #   eager        — on pr.opened / synchronize / reopened, in parallel with CI
  #   after-checks — once the head SHA's checks SETTLE, either colour (default:
  #                  the review can then read and cite the CI result, and a
  #                  push-storm collapses to one review per settled SHA)
  #   on-request   — never automatically; only when explicitly asked for
  trigger: after-checks
  requestLabel: null           # label that requests a review in `on-request` mode
  skipDraft: true              # skip draft PRs (what the review cron has always done)
  # Paths whose contents are DERIVED, not authored (issue #271). When every path
  # changed since our last posted review matches one of these, the re-review is
  # skipped — a lock-file re-derivation is a new head SHA, and per-head dedup
  # alone made that a second, byte-identical formal review.
  #
  # Never suppresses a FIRST review, an explicit `@bot review`/request label, or
  # a push that also touched a hand-written file. Set to `[]` to turn the gate
  # off. Patterns: `*` stops at a `/`, `**` crosses one, and a pattern with no
  # `/` matches a basename anywhere in the tree.
  #
  # Repo-settable, SUPERSET-only — a repo may add its own generator output, but
  # dropping one of these entries buys it more review runs and is restored.
  generatedPaths:
    - "*.lock"
    - package-lock.json
    - npm-shrinkwrap.json
    - pnpm-lock.yaml
    - yarn.lock
    - bun.lockb
    - go.sum
    - "*.min.js"
    - "*.min.css"
    - "*.generated.*"
    - "**/__generated__/**"
  # The review evidence pipeline (docs/plans/review-evidence-pipeline/).
  #
  # OFF by default and that is a locked decision: `enabled: false` reproduces
  # today's two-phase review BYTE-FOR-BYTE — every variable this block governs
  # is absent from the template context rather than present-and-empty. Each
  # stage lands dark and is switched on per deployment once it is measured.
  #
  # What `enabled: true` adds today (WP0, the `spec` axis):
  #   - `{{prBody}}` + `{{linkedIssues}}` — the PR body and the issues it closes
  #     (`closingIssuesReferences`), neither of which reached a prompt before.
  #   - `{{specObligations}}` — one obligation per acceptance criterion found in
  #     the issue/PR body, each naming BOTH ENDS of the mechanism: the criterion
  #     itself, and the changed files that could satisfy it with `found: false`.
  #     A one-ended seed measures WORSE than no seed (IRIS ablation: -3), which
  #     is why the second end is the mechanical changed-file list and never
  #     prose.
  #   - the split verdict: `findings.json` may carry
  #     `verdict: { spec, standards }` and a `fail` on either axis stops the
  #     review being an APPROVE, so a clean standards pass can no longer hide a
  #     spec miss (issue #271 fix 7).
  #
  # OPERATOR-ONLY — unlike every other `review:` key, a repo may not set this.
  # It is spend, with no "more conservative" direction to clamp towards.
  # What `enabled: true` additionally adds from WP3 (the facts-derived families):
  #   - a `facts` phase writing .lastlight/pr-review/facts.json (no model spend)
  #   - a `seed` phase turning it into obligations.json + one rendered block per
  #     family, each naming BOTH ENDS of a mechanism
  #   - six survey phases, one per family, each appending to its OWN
  #     hypotheses/<family>.jsonl — no pass ever reads or rewrites another's,
  #     which makes consensus collapse impossible by construction rather than
  #     by instruction
  #
  # Neither phase can run where `lastlight-facts` is not resolvable. That is
  # true of the SANDBOX IMAGE today (WP2 is what installs it); the eval harness
  # runs `--sandbox none` on the host, where it is. Set LASTLIGHT_FACTS_BIN to
  # point at a specific build. A missing binary degrades to a `coverage: "none"`
  # envelope and the survey phases say so — it never fails the run.
  analysis:
    enabled: false
    # A SAFETY BOUND, not a budget — it should never bind on a real PR. The
    # extractor still ranks, truncates and records what it dropped, but this
    # number exists only to stop a pathological PR blowing the prompt.
    #
    # It was 6, and while the spec axis produced nothing that was inert. The
    # moment the axis started working it became the binding constraint on FIVE
    # of the six linked cases in the gate set — 11 criteria extracted and 6 kept
    # on the three `1587` cases, 10 and 6 on the two `1641` ones. What it was
    # discarding is the acceptance-criteria checklist a human wrote on the
    # issue, which is the most direct statement of intent this pipeline ever
    # gets. Capping GENERATION also inverts locked decision 2: we deliberately
    # over-generate and let the probe oracle and WP6b's attention boundary
    # (maxInlineComments + the family thresholds) do the narrowing. Truncating
    # obligations truncates DISCOVERY, and discovery is the measured ceiling.
    maxSpecObligations: 40
    # The same, for the five facts-derived families pooled. Ranked by mechanism
    # class (`enforcement` and `contract` are the two that have ever converted)
    # then by how much of the impact cone lies outside the diff.
    maxObligations: 40
    # How many of the six families actually run. SIX. A previous design defaulted
    # this to 3 against six families and never recorded which three ran, so half
    # never executed and `enforcement` — the only family that has produced a gold
    # match — could have been among them.
    surveyPasses: 6

    # How many of those families run AT ONCE (WP11c).
    #
    # A CEILING the run clamps again per backend, never the effective value. On
    # the shipped default backend (gondolin) each agent session is a QEMU
    # micro-VM inside the harness process, so it pins to 1 and this key changes
    # nothing at all until that is measured; `none` and `docker` take it as
    # written.
    #
    # Six because the six families write six disjoint, append-only
    # `hypotheses/<family>.jsonl` and never read each other's — there was never
    # an ordering constraint between them, only a scheduler that ran one DAG
    # node at a time. Chained, they were 851s of a 29-minute review (49% of the
    # wall clock); concurrent, they cost the slowest single family.
    #
    # Lower it to bound provider rate-limit pressure or memory, NOT to bound
    # spend: six passes cost the same in tokens either way.
    surveyConcurrency: 6

    # ── WP4: `prepare` (the affordance) + `falsify` (the oracle) ──────────────
    #
    # A SECOND switch under an already-gated block, and deliberately so. What
    # `probes: true` buys is a review workspace with a `node_modules` in it, and
    # that one fact changes three things at once:
    #
    #   - `contract` can seed at all on a normal monorepo. A tsconfig that
    #     `extends` a bare package specifier (`@calcom/tsconfig/react-library`)
    #     does not resolve on a bare checkout, tsgo excludes the project, and the
    #     case drops to tier 2 with `contracts` emitting nothing. Measured over
    #     the 50-PR corpus: tier-1 cases 21 -> 5, contract deltas 73 -> 19.
    #   - `tests` can seed at all. The `coverage` extractor READS a report and
    #     never runs a suite; it found ZERO artifacts across all 50 corpus cases
    #     and all 8 gate cases. Until `probeCoverage` produces one, that family
    #     is NOT MEASURED — a different row from "did not convert".
    #   - the `facts` phase inherits an installed tree, on every re-review too
    #     (the cross-run refresh is `git clean -fdx -e node_modules`). Peak RSS
    #     there is UNMEASURED on the current engine.
    #
    # Default posture: OFF in production, ON in the eval overlay — whether it
    # ships on is an ablation number, not a judgement call.
    probes: false
    # Let the install run the tree's own postinstall. OFF, as a SECURITY default:
    # `prepare` installs at a PULL REQUEST HEAD, so a lifecycle script there is
    # code the PR author wrote running on this machine — and `pr-review`'s
    # workspace has never installed anything, which makes this the first thing in
    # the workflow that could. Making an `extends` resolve needs the files, not
    # their scripts.
    probeLifecycleScripts: false
    # The repo's own `tsc --noEmit`, for per-file/per-line diagnostics a
    # hypothesis can be anchored to. NOT a CI re-run: CI already reports
    # pass/fail over a matrix and `{{ciSection}}` is already in the context.
    probeTypecheck: false
    # The ONE step in this pipeline that runs a test suite — the wall-clock item
    # the design review deleted along with `mutants`. Its own switch because it
    # is its own price: everything else in `prepare` is seconds, this is minutes.
    # It never guesses a command, only one the repo itself named (a `coverage` /
    # `test:coverage` script).
    probeCoverage: false
    prepareTimeoutSeconds: 300
    coverageTimeoutSeconds: 900
    # Rounds `falsify` gets to write and run probes. Two: the loop's exit is a
    # five-line existence gate, not a validator — v2's full quote validator was
    # overkill and cost 2.4x for a worse result.
    probeRounds: 2
    # The attention boundary (WP6b). Preserving internal recall and spending a
    # human's attention are two different budgets; conflating them is how a
    # recall-first reviewer becomes unreadable.
    #
    # Everything past the inline budget goes to the review BODY under
    # "Additional findings" — still posted, still visible. Nothing is dropped
    # for being noisy: this is an attention boundary, not the v2 suppressor that
    # was built, measured and reverted.
    #
    # Eight, from "Does AI Code Review Lead to Code Changes?" (22k+ real review
    # comments): concise, hunk-level, actionable findings are substantially
    # likelier to cause a change. Twenty inline comments is a muted bot.
    maxInlineComments: 8
    # Per-family confidence bar for an INLINE comment; below it, the body.
    # Per-family and not global because AutoCommenter (Google Critique) measured
    # a global threshold as catastrophic — at t=0.98, ~80% of below-threshold
    # predictions were still CORRECT — while per-URL thresholds raised recall
    # without hurting precision.
    #
    # THESE ARE INITIAL GUESSES TO BE TUNED ON THE TRAIN SPLIT, NOT
    # MEASUREMENTS. Record each retune in the eval journal.
    thresholds:
      contract: 0.35      # converts; cheap to check; bias to surface
      enforcement: 0.35
      security: 0.30
      state: 0.50
      tests: 0.60         # mechanical provenance, but noisier as prose
      spec: 0.45
    # Below this, recorded in findings.json but not posted at all. The one tier
    # that costs recall, so it is low. A finding carrying NO confidence is never
    # affected — an absent field is not a zero.
    internalFloor: 0.15

# Retry policy for every PR_FIX_SHAPED workflow — pr-fix and dependabot-ci-fix
# (issue #251). The loop diagnoses a CI failure before it retries, and these are
# the budgets that bound it.
#
# Repo-settable (a repo may commit its own values in `.lastlight/lastlight.yml`),
# clamped ONE WAY — a repo can only ever be MORE conservative than this block:
#   maxAttempts / localIterations / maxFlakyDeferrals   min(repo, operator)
#   maxCostUsd                                          min, `null` = unbounded
#   retryableClasses                                    a subset of this list
# `escalateModelAfterAttempt` (spend) and `gateTimeoutSeconds` (shared resource)
# are OPERATOR-ONLY — a repo setting them is dropped with a warning.
fix:
  maxAttempts: 3               # cross-run attempts per (repo, PR) before requires-human
  localIterations: 2           # within-run gate-loop iterations inside ONE attempt
  gateTimeoutSeconds: 900      # until_bash budget for the repo's build/test gate
  escalateModelAfterAttempt: 1 # attempts above this use models["pr-fix-retry"] when set
  maxCostUsd: 5.0              # cumulative ceiling across attempts for one PR; null = off
  maxFlakyDeferrals: 2         # a `flaky` verdict defers this often, then counts as reproducible
  # Diagnosis classes another attempt can help with; every other class escalates
  # immediately instead of burning budget. The vocabulary is
  # reproducible | env-mismatch | flaky | infra-dependent | upstream-broken.
  retryableClasses: [reproducible, env-mismatch]

# How dependency PRs are merged (issue #252). Impact — not semver magnitude — is
# what gates a MAJOR bump: a @types/* major is not a framework rewrite.
#
# Repo-settable and clamped one way, as above:
#   autoMergeMaxImpact    the LOWER tier on none < low < medium < high
#   requireSettledChecks  add-only `true` (a `false` is dropped with a warning)
#   auditComment          free — cosmetic
# `minSettledChecks` is OPERATOR-ONLY: clamping it `max(repo, operator)` would
# weld the escape hatch shut for a repo with no CI at all.
dependencies:
  autoMergeMaxImpact: medium   # none | low | medium | high — ceiling for auto-merging a MAJOR
  requireSettledChecks: true   # enforce settled-"passing" on ALL routes (webhook, cron, comment)
  minSettledChecks: 1          # an auto-merge decision needs >= N settled checks; 0 = legacy behaviour
  auditComment: true           # post the evidence comment when auto-merging a major

# Which crons participate (issue #180). The SAME block is valid here, in your
# overlay's config.yaml, and in a managed repo's .lastlight/lastlight.yml — the
# meaning depends on the layer:
#
#   operator (here / overlay)  disable: [x]  → cron x is off globally
#                              enable:  [x]  → no-op; a cron is on by default
#   repo (.lastlight/)         disable: [x]  → THIS repo drops out of x's fan-out
#                              enable:  [x]  → THIS repo opts in even when x is
#                                              off globally
#
# A name in BOTH lists is disabled, at every layer — a cron that doesn't run is
# the safe reading of a contradictory config.
#
# `disabled.crons` below is the LEGACY spelling of `crons.disable` and still
# works exactly as before: it is unioned into this list (and additionally drops
# the cron's definition at asset-load time, so it is the harder kill).
#
# NOTE: `crons.disable` here means "off BY DEFAULT" — a repo listed in
# `repoConfig.allowKeys` can still opt itself back in. If you want a kill switch
# no repo can override, drop `crons` from repoConfig.allowKeys (below); that
# leaves this list as the only word on the subject.
crons:
  enable: []
  disable: []

disabled:
  workflows: []
  # Legacy alias for `crons.disable` above — kept working, not deprecated.
  crons: []
  prompts: []
  skills: []
  agentContext: []

routes:
  github:
    issue_opened: issue-triage
    issue_answer: answer
    issue_reopened: issue-triage
    pr_opened: pr-review
    pr_synchronize: pr-review
    pr_reopened: pr-review
    # `review.trigger: after-checks` — the head SHA's checks have settled on a
    # PR that neither the fix nor the merge route claimed.
    pr_checks_settled: pr-review
    # `review.requestLabel` was applied (the `on-request` mechanism).
    pr_labeled: pr-review
    # A review was requested from the bot by name, or the `last-light/review`
    # check's Re-run button was pressed.
    pr_review_requested: pr-review
    approval_response: approval-response
    security_review: security-review
    verify: verify
    qa_test: qa-test
    demo: demo
    pr_fix: pr-fix
    pr_review: pr-review
    pr_comment: pr-comment
    issue_build: build
    issue_explore: explore
    issue_comment: issue-comment
    security_feedback: security-feedback
    explore_reply: explore-reply
  slack:
    reset: chat-reset
    status: status-report
    approve: approval-response
    reject: approval-response
    build: build
    triage: issue-triage
    review: pr-review
    security: security-review
    verify: verify
    qa_test: qa-test
    demo: demo
    explore: explore
    answer: answer
    chat: chat
    explore_reply: explore-reply

cron:
  webhooksEnabledCondition: true

# Where a repo's outbound notifications go. TODAY this is read only by the
# weekly Slack digest (`workflows/cron-digest.yaml`).
#
# This block is the BASE the per-repository layer merges onto — a managed repo
# sets `notifications: {slack: {channel: C01ABCDEFGH}}` in its
# `.lastlight/lastlight.yml` and its digest goes there. Leaving it `null` here
# is the point: an operator routes repos with the `slack.repoChannels` map
# below, which is per-repo by construction, whereas this block is not.
#
# `channel: null` committed by a REPO is not the same as absent — it means "send
# me no digest" and beats the operator's map. Absent means "I have no opinion,
# use whatever you've configured".
notifications:
  slack:
    channel: null

slack:
  # Operator-side channel routing: "owner/repo" -> Slack channel id. Consulted
  # after the repo's own `notifications.slack.channel` and before the global
  # SLACK_DELIVERY_CHANNEL fallback. Set it in the instance overlay's
  # config.yaml, not here.
  #
  #   repoChannels:
  #     nearform/lastlight: C01ENGINEERING
  #
  # Channel ids are not secrets, so they show up unredacted on /admin/api/config.
  repoChannels: {}

# The weekly repo digest — what happened in a repo, and what Last Light did
# about it, posted to that repo's Slack channel.
#
# It is INERT until a channel resolves for a repo (see `notifications` above):
# no channel, no post, no cost. That is deliberate — a fresh install should not
# start talking to a workspace nobody configured.
#
# The facts are computed in code, from the GitHub API and the harness's own
# SQLite, so the numbers are right. `narrative` adds ONE cheap model call that
# turns the week's merged PRs and issues into a few sentences of plain English;
# it is never asked to produce a number, and a failure there drops the summary
# rather than the digest.
#
# The content lists (which PRs merged, which issues opened and closed) come from
# a second, GraphQL request that is likewise allowed to fail: if it does, the
# digest posts the counts alone, exactly as it did before the lists existed.
digest:
  windowDays: 7        # how far back a digest looks
  narrative: true      # false = counts + lists only, zero model spend
  maxItems: 5          # cap on the escalation list
  listItems: 8         # cap on each content list (merged PRs, issues opened/closed); max 25
  detailItems: 25      # how many items' text the summariser reads; max 60 — it sizes a prompt
