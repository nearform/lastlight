# Dependabot config for the nearform/lastlight monorepo (pnpm + Turborepo).
#
# npm is pointed at the repo root ONLY. Dependabot resolves the pnpm workspace
# from pnpm-workspace.yaml there, so one root run updates every member's
# package.json AND the single root pnpm-lock.yaml together. Per-package
# directories must NOT be listed: those runs bump one package.json without the
# lockfile, so CI fails on `pnpm install --frozen-lockfile`, and they duplicate
# the root PR. The frozen eval fixture under apps/evals/datasets/** (an
# intentionally-buggy eval case) is not a workspace member, so it stays out.
version: 2

updates:
  # ── npm / pnpm: every workspace package ────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Group minor/patch bumps to keep PR noise down; majors get their own PRs.
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # ── GitHub Actions: the workflows in .github/workflows ─────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  # ── Docker (disabled) ──────────────────────────────────────────────────────
  # Base images are pinned on purpose (node:22-slim / node:20-slim, matching
  # .nvmrc and engines.node), and the sandbox images build from a local
  # ARG BASE_IMAGE that Dependabot can't resolve. Enable this only if you want
  # PRs proposing new Node major tags (e.g. node:24-slim).
  #
  # - package-ecosystem: "docker"
  #   directory: "/apps/server"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #   commit-message:
  #     prefix: "build(deps)"
