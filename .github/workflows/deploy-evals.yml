name: Deploy evals

# Deploy the evals dashboard (apps/evals → evals.lastlight.dev) to Cloudflare.
#
# A deploy-only LEAF job — deliberately NOT part of the shared CI (ci.yml). It
# is RELEASE-GATED: it fires on a published GitHub Release (+ workflow_dispatch),
# NOT on every push to `main`. Release cadence is deliberate here — the CI deploy
# only ever ships the SPA shell + the VENDORED sample data, so gating it keeps a
# manual real-data deploy alive until the next release instead of clobbering it
# on the next unrelated push.
#
# DATA NUANCE — this Action ships the SPA SHELL + the committed SAMPLE /data:
#   `eval-results/` is gitignored and absent in CI, so build:site falls back to
#   the vendored `sample-results/` (one run per tier) — /api/index + /data are
#   baked from it. Publishing refreshed REAL results stays a MANUAL local
#   `npm run deploy` from a machine that holds eval-results/ (see the
#   evals-live-dashboard runbook). CAUTION: a sample-only release deploy that
#   lands AFTER a manual data deploy resets /data back to the sample — but only
#   at release time now, not on every push.
#
# Requires the CLOUDFLARE_API_TOKEN repo secret (scoped to Workers deploys on
# the lastlight.dev zone account) — set by a human, referenced here.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-evals
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:site is NO LONGER self-contained, which is what the note here used
      # to warn about in the conditional: `scripts/build-site.ts` runs via tsx
      # over apps/evals/src, and that import graph (build-site -> report ->
      # grade) now reaches `lastlight-core/evals` — `grade.ts` imports the core
      # barrel as of #256. tsx resolves that to
      # `apps/evals/node_modules/lastlight-core/dist/evals-api.js`, a symlink
      # into apps/server, so the site build needs core's `dist/` on disk and
      # died with ERR_MODULE_NOT_FOUND on every release from v0.23.0 to v0.23.3.
      #
      # The TRAILING-dots `pkg...` form is "pkg AND its dependencies"
      # (topologically ordered by pnpm). The note that used to live here said the
      # opposite — that the LEADING-dots `...pkg` form selected dependencies —
      # and it is wrong: `...pkg` selects DEPENDENTS, which is an exact no-op
      # here because nothing depends on lastlight-evals. Following it produced a
      # step that built only lastlight-evals itself and left the ERR_MODULE_NOT_FOUND
      # in place. Verified with `pnpm --filter '<form>' list --depth -1`:
      # `lastlight-evals...` selects evals + core + shared + workflow-engine +
      # agentic-pi; `...lastlight-evals` selects evals alone.
      - name: Build dependencies (lastlight-core's dist/ — build:site imports it)
        run: pnpm --filter 'lastlight-evals...' build

      # Assembles dist-site/ (SPA shell + baked /api/index + /data copy — from
      # the vendored sample-results/ in CI, see the header note).
      - name: Build site
        run: pnpm --filter lastlight-evals run build:site

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        working-directory: apps/evals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
